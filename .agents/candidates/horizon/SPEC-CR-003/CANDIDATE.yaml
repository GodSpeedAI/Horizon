    ledger_sha256: 1e81c1af7508ce414b91e3b5953167aaaf754e470e69f2985e476dd2868e92c3
  observed_inconsistency: >-
    .agents/CURRENT_STATUS.md (revision 32) names HORIZON-001 1.1.0 as the frozen spec, while the Wayfinder
