    verification_gate: "verify_case_declarations (crates/sea-forge-authority/src/cep/declaration_authority.rs) is the one verifier used by reconciliation, reads, resume and promotion"
  blockers:
    - id: D1
      state: RESOLVED in sea-rs code (was: no selector for external-only scope)
      evidence: "settlement_authority_class selector, see implementation_evidence.selector. Tested in sea-rs crates/sea-forge-authority tests."
      remaining: "A rule with this selector must be checked against the production policy.yaml, which is root-owned and not in the repo."
    - id: D2-SWE-SEED-PATH
      state: RESOLVED in code (was: server path bypassed the gate)
      evidence: "delegation.rs submit_swe_seed_declaration calls authorize_settlement_declaration before append (implementation_evidence.gate_on_server_path)."
      remaining: "Confirm in the live round trip that the SWE_SEED path returns awaiting approval for an external declaration."
    - id: D3-DECLARER-ROLE
      state: OPEN, UNVERIFIED
      finding: >-
        Declarer.role for SWE_SEED is permitted_declarer_roles.first() from the policy's settlement_authorities block
        (delegation.rs ~895-896). Fixtures use R-AA and operator. The production value is not in the repo, and it is a
        free string, not the ActorRole the gate uses.
      consequence: "The gate decides on the verified socket role and the derived class, not on this string. Confirm the production value before apply."
    - id: F-A-DECLARATION-BINDING
      state: OPEN, owner decision (CodeRabbit Major, security, on PR #80; code from PR #79)
      finding: >-
        verify_one (declaration_authority.rs) authorises a declaration from its copied authorization_request_sha256 and
        declaration_id. It does not recompute declaration_hash, and it does not check the declared content against the
        approved declared_request_sha256. A Completed record is bound only by declaration_ref == declaration_id. Promotion
        and the Thoth view read the unchained settlement/declarations.jsonl view, so a local edit to that view can change
        status, weight, tags, or qualifies_for_capability.
      owner_decision: >-
        Decide which record is authoritative for promotion: the hash-chained case ledger only (promotion reads ledger
        entries and verifies the payload hash), or the view with its own hash check. Recommended: the chained ledger.
        This is a security-model change and needs owner approval before implementation.
    - id: F-B-RESUME-START-RECONCILE
      state: OPEN, owner decision (CodeRabbit Major, stability, on PR #80; code from PR #79)
      finding: >-
        reconcile_open_settlement_attempts runs at the start of every resume. For a claimed attempt with no declaration yet,
        it records a terminal failed status. A concurrent resume that is still declaring can therefore fail, and its
        declaration is then quarantined and the approval is spent.
      owner_decision: >-
        Choose one: (1) reconcile only claims older than a bound larger than the declare timeout; or (2) refuse to resume
        while a claim is open and run reconciliation only in an explicit recovery step. Recommended: (1), because it needs
        no new operator step.
