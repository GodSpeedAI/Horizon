# Refusal is a first-class outcome: every blocked action reports why and what would repair it.
refusal_codes:
  unlisted_operation: "The operation is not in the closed catalog. Nothing was written."
  unmapped_route: "The route maps to no catalog row. Nothing was written."
  unknown_action: "The route is listed but the semantic action is not. Nothing was written."
  insufficient_evidence: "The required human evidence is absent or weaker than the row demands."
  grant_required: "A governed target needs a live grant or a current entitlement."
  grant_not_allowed: "A human caller has no grant; supplying one is refused rather than ignored."
  stale_revision: "The resource moved since the operation was described."
  authority_unavailable: "The authority writer could not decide. No effect was dispatched."
  isolation_unavailable: "This host does not meet the isolation prerequisites."
  separation_of_duty: "The approver must differ from the requester and the executor."
  budget_required: "A P3 grant without an explicit numeric budget is refused."
  not_owner: "The caller's key does not own the panel or question the action names."
  caller_substituted: "The caller kind, role, or reference disagrees with the authenticated session."
  alias_action_mismatch: "The request's action or resolution disagrees with the operation ID that fixes it."
