manifest_version: "horizon.identity.operations/2"
contract_id: "horizon.identity.operations"
contract_version: "2.0.0"
frozen_at: "2026-11-09"
authority:
  design: "design_draft.md sections 11 and Appendix A"
  spec: { id: "HORIZON-001", version: "1.2.0", sha256: "7b06f6b813462e08432b6e020e9266bdec625b2fee7140d4f2f52a774f9fa435" }
  owner_decision: "2026-11-09 — owner authorized reconciling the catalog against implemented behaviour, classifying the agent door per semantic action, treating session logout as session lifecycle, aliasing the third intent route, and classifying search by effect."
  note: >-
    This file is the implementation binding of a closed catalog. An operation ID that is not
    listed below, or a write route that maps to no row, is Px and fails closed. A route name,
    HTTP method, client label, or caller role can never move an operation to a weaker class.
    A route that carries several semantic actions is dispatched by the handler from the action
    the handler actually performs (see `dispatch`), never from a blanket route class.

classes: [P0, P1, P2, P3, PX]

authority_writers:
  local_read_policy: "Local read policy only. Cannot write, create a grant, or create a pending approval."
  cognate_local_policy: "Cognate local policy. No grant creation."
  cognate_local_continuation: "Cognate continuation for a local decision."
  sea_forge: "SEA-Forge decision, epoch, and bounded grant."
  issuer_root: "Cognate/issuer root, local console only."
  case_record.authority: "Selected per record: local → Cognate continuation; governed → SEA-Forge."

budget_units: [currency, tokens, calls, bytes]

class_defaults:
  P0:
    executor: human_session
    authority_writer: local_read_policy
    human_evidence: A0
    pending_expiry: null
    params_schema: params.read
    offline_allowed: true
    writable: false
    ownership: none_required
    scope_rule: >-
      A read has no effect to own: it observes state and changes nothing. `none_required` here
      states that, and it is the only reason no owner is named.
  P1:
    executor: human_session
    authority_writer: cognate_local_policy
    human_evidence: A0_OR_A1
    pending_expiry: null
    params_schema: params.local_write
    offline_allowed: true
    writable: true
    ownership: none_required
    scope_rule: >-
      A P1 effect is reversible work inside the caller's own scope: a draft, note, panel, row or
      frame the caller already owns. The design's P1 rule ("authenticated execution inside its
      existing ownership and scope") is the scope, so `none_required` means "no owner beyond the
      caller", never "no owner named". A P1 row that reaches outside the caller's scope declares
      an explicit `ownership` instead.
  P2:
    executor: human_session
    authority_writer: cognate_local_continuation
    human_evidence: A3-UV
    stage0b_evidence: A3-T
    pending_expiry: 10m
    offline_allowed: false
    writable: true
    ownership: none_required
    scope_rule: >-
      A P2 effect is reserved: it changes shared state or another principal's holding, so it needs
      a named owner of the target (a panel, a question, the board, a session) or an explicit
      statement that the effect is local and self-owned. A row that names no owner because it
      changes only the caller's own local state says so here.
  P3:
    executor: human_session
    authority_writer: sea_forge
    human_evidence: A3-UV
    pending_expiry: null
    offline_allowed: false
    writable: true
    ownership: none_required
    scope_rule: >-
      A P3 effect commits outside the trust domain or a person. It is never owned by the caller:
      the authority decision, the fence and the separation-of-duty rule carry the responsibility,
      and the pending record names the requester, the executor and the approver separately.
  PX:
    executor: null
    authority_writer: null
    human_evidence: null
    pending_expiry: null
    offline_allowed: false
    writable: false
    ownership: none_required
    scope_rule: "A Px row has no effect, so it has no scope and no owner."

# Each class is a group; a row may restate a field to override its class default.
# binding: verified  — a route or code op in this repository was read and maps to this row
#          candidate — the row is frozen by the catalog but no route binding was confirmed
#          reserved  — no route exists yet; the row is the target of a later stage
# ownership: none_required | caller_owns_panel | caller_owns_question | caller_own_session |
#            person_owns_board | caller_scoped_own_rows
operations:
  P0:
    - id: horizon.health
      binding: verified
      routes: ["GET /health"]
      executor: anonymous_connection
      caller_authentication: none_public_liveness
      note: >-
        The liveness probe is deliberately public: it answers before any session exists, so it
        authenticates no caller and owns nothing. It says the process is up; it exposes no case,
        panel, note or evidence, and it is not a human-session operation.
    - { id: horizon.research.health, binding: candidate }
    - { id: horizon.workspace.read, binding: candidate, routes: ["GET /workspace.json", "GET /desk/state.json"] }
    - { id: horizon.case.read, binding: candidate }
    - { id: horizon.evidence.read, binding: candidate }
    - { id: horizon.economics.read, binding: verified, routes: ["GET /workspace/economics"] }
    - { id: horizon.inspect.focus, binding: candidate, routes: ["GET /workspace/inspect"] }
    - { id: horizon.inspect.neighborhood, binding: candidate, routes: ["GET /workspace/inspect"] }
    - { id: horizon.navigation.inspect, binding: candidate, routes: ["GET /frame"] }
    - { id: horizon.context.query_reference, binding: candidate }
    - { id: horizon.remote.status, binding: verified, routes: ["GET /workspace/remote/status"] }
    - { id: horizon.settlement.observe, binding: candidate }
    - { id: workbench.view.read, binding: candidate }
    - { id: gauntlet.run.read, binding: candidate }
    - { id: realitytrace.observation.read, binding: candidate }
    - id: horizon.search.read
      binding: verified
      routes: ["GET /desk/search", "POST /desk/search"]
      params_schema: params.horizon_search_read
      note: >-
        Classified by effect, not by HTTP method: the POST form is the Find action and reads
        only. The same route also performs horizon.search.record when, and only when, the body
        asks the find to be recorded; that write is a separate operation with its own class.
    - id: agent.response.read
      binding: verified
      routes: ["POST /agent/panels", "GET /agent/panels/answers"]
      code_ops: ["read_responses"]
      params_schema: params.agent_response_read
      executor: agent_execution
      caller_authentication: registered_agent_key
      ownership: caller_owns_question
      note: >-
        An agent reads only the answers to questions its own key put up. Read-only: no panel,
        conversation row, or receipt is written.

  P1:
    - { id: horizon.navigation.defer, binding: candidate, code_ops: ["navigation.defer"] }
    - { id: horizon.navigation.reframe, binding: candidate, code_ops: ["navigation.reframe"] }
    - { id: horizon.navigation.disagree, binding: candidate, code_ops: ["navigation.disagree"] }
    - { id: horizon.navigation.intent.commit, binding: verified, routes: ["POST /intent"] }
    - { id: horizon.surface.intent.commit, binding: verified, routes: ["POST /surface/intent", "POST /workspace/intent"] }
    - { id: horizon.note.save, binding: verified, routes: ["POST /desk/note"] }
    - { id: horizon.note.remove, binding: candidate }
    - { id: horizon.draft.save, binding: verified, routes: ["POST /desk/draft"] }
    - { id: horizon.conversation.discard, binding: verified, routes: ["POST /desk/conversation/discard"] }
    - { id: horizon.case.open, binding: verified, routes: ["POST /workspace/case"] }
    - { id: horizon.lesson.propose, binding: verified, routes: ["POST /desk/lesson"] }
    - { id: horizon.onboarding.skip, binding: verified, routes: ["POST /workspace/onboarding/skip"] }
    - { id: horizon.onboarding.resume, binding: verified, routes: ["POST /workspace/onboarding/resume"] }
    - { id: horizon.workspace.presenting, binding: verified, routes: ["POST /workspace/presenting"] }
    - { id: workbench.draft.save, binding: candidate }
    - { id: workbench.conversation.discard, binding: candidate }
    - { id: workbench.expert.launch, binding: candidate }
    - id: horizon.search.record
      binding: verified
      routes: ["POST /desk/search"]
      params_schema: params.horizon_search_record
      ownership: caller_scoped_own_rows
      note: >-
        The write half of the Find action: one conversation row in the caller's own scope, and
        only when the body sets `record` and the query is not empty. The class rises with the
        effect; the read half stays P0.
    - id: session.pair
      binding: verified
      routes: ["POST /desk/pair"]
      params_schema: params.session_pair
      executor: local_console
      ownership: caller_own_session
      note: >-
        The desk's browser-session ceremony: a code typed at the local console is exchanged for
        a local session cookie. It creates one local session and enrolls no credential, so it is
        a local, reversible P1 effect on the caller's own session rather than the governed device
        enrollment (`device.pair`). The code is possession evidence for this local session only:
        it is not an assurance predicate and grants no authority over anything else.
    - id: session.logout
      binding: verified
      routes: ["POST /desk/pair/logout"]
      params_schema: params.session_logout
      ownership: caller_own_session
      note: >-
        Session lifecycle, not device removal: the handler deletes only the session named by the
        caller's own cookie. Ending another session or removing a paired device is governed
        (see device.remove).
    - id: agent.surface.publish
      binding: verified
      routes: ["POST /agent/panels"]
      code_ops: ["show_surface"]
      params_schema: params.agent_surface_publish
      executor: agent_execution
      caller_authentication: registered_agent_key
      ownership: caller_owns_panel
      note: >-
        P1 because the implemented path creates or updates an agent-owned shared surface: the
        panel is admitted to the shared board and a conversation row is committed with it. An
        update is refused when another key owns the panel. A P0 private, ephemeral presentation
        with no shared write is a distinct semantic action; no such path exists in this handler,
        so it has no row and cannot be claimed here.
    - id: agent.surface.arrange
      binding: verified
      routes: ["POST /agent/panels"]
      code_ops: ["arrange"]
      params_schema: params.agent_surface_arrange
      executor: agent_execution
      caller_authentication: registered_agent_key
      ownership: caller_owns_panel
      note: >-
        `surface.remove` writes: it removes an agent-owned panel only when every question on it
        belongs to the same key, and refuses a pinned panel. Every other arrange sub-action is
        observed to write nothing (focus and placement are the person's). The row stays P1 for
        all sub-actions because the handler cannot be classified from a request-supplied label;
        a sub-action that later gains an ownership-transferring effect is a P2 row, not a P1
        variant.
    - id: agent.surface.annotate
      binding: verified
      routes: ["POST /agent/panels"]
      code_ops: ["annotate"]
      params_schema: params.agent_surface_annotate
      executor: agent_execution
      caller_authentication: registered_agent_key
      ownership: caller_owns_panel
      note: "A note is added only to a panel the caller's key owns; a panel with no recorded owner has no agent that may annotate it."
    - id: agent.question.ask
      binding: verified
      routes: ["POST /agent/panels"]
      code_ops: ["ask_human"]
      params_schema: params.agent_question_ask
      executor: agent_execution
      caller_authentication: registered_agent_key
      ownership: caller_owns_panel
      note: >-
        Proposing an ordinary question is P1. It grants nothing: the person's `human.answer`
        stays P2 with its own confirmation, and moving a question to another agent (ask.reassign)
        and a required decision remain governed.
    - id: human.panel.open
      binding: verified
      routes: ["POST /desk/panels/op"]
      code_ops: ["human.open"]
      params_schema: params.human_panel_open
      ownership: person_owns_board
      note: "Opens a person-owned panel from a closed template; no agent key may perform it and it creates no pending decision."
    - id: human.panel.close
      binding: verified
      routes: ["POST /desk/panels/op"]
      code_ops: ["human.close"]
      params_schema: params.human_panel_close
      ownership: person_owns_board
      note: >-
        The person closes a panel. It is P1 because it is the person's own board and it settles
        nothing; a question left unanswered on a closed panel is still unanswered, and closing a
        panel is never an answer (the answer rows and their rules are untouched).

  P2:
    - id: human.answer
      binding: verified
      routes: ["POST /desk/panels/op"]
      code_ops: ["human.answer"]
      params_schema: params.human_answer
      ownership: none_required
      note: "The agent door refuses every human.* op with 403; only the person's paired panel route performs it."
    - id: ask.route
      binding: verified
      routes: ["POST /agent/panels"]
      code_ops: ["answer.route"]
      params_schema: params.ask_route
      executor: agent_execution
      caller_authentication: registered_agent_key
      authority_writer: case_record.authority
      ownership: caller_owns_question
      note: >-
        The agent records where an answer went. It is a claim, not delivery: the row stays
        claimed and nothing marks a step done without independent evidence. The executor is the
        agent execution, authenticated by its registered key, because that is who acts: the design
        defines the executor as the agent or service acting, and the only credential that reaches
        this handler is the agent key. The P2 human evidence is unchanged (A3-UV, and A3-T under
        Stage 0B), so the agent proposes the route and the human authorises the effect. The
        design's P2/P3 table cell that named a human session for this row is corrected here and in
        the defect record; the class, the authority writer and the evidence are not changed.
    - id: ask.reassign
      binding: verified
      routes: ["POST /desk/panels/op"]
      code_ops: ["human.reassign_owner"]
      params_schema: params.ask_reassign
      authority_writer: case_record.authority
      ownership: person_owns_board
      note: "Moving a waiting question to another registered agent is a person-reserved ownership change; an agent cannot perform it."
    - id: ask.withdraw
      binding: verified
      routes: ["POST /desk/panels/op", "POST /agent/panels"]
      code_ops: ["human.stop_waiting", "ask.withdraw"]
      params_schema: params.ask_withdraw
      executor: agent_execution_or_human_session
      caller_authentication: registered_agent_key_or_human_session
      authority_writer: case_record.authority
      ownership: none_required
      note: "`human.stop_waiting` stops waiting on a step; the agent's `ask.withdraw` withdraws its own unanswered question and is refused once the question is answered, agreed, or required. The row has two callers: the person on the desk route and a registered agent key on the agent door, so the executor and the credential are named per caller. The class and the human evidence are unchanged."
    - id: owner.pin
      binding: verified
      routes: ["POST /desk/panels/op"]
      code_ops: ["human.pin"]
      params_schema: params.owner_pin
      ownership: person_owns_board
    - id: workspace.label
      binding: verified
      routes: ["POST /workspace/label"]
      params_schema: params.workspace_label
    - id: handoff.send
      binding: verified
      routes: ["POST /desk/handoff"]
      params_schema: params.handoff_send
      authority_writer: sea_forge
      note: "POST /desk/handoff/preview is a read and is not a send."
    - id: lesson.decide
      binding: verified
      routes: ["POST /desk/decide"]
      params_schema: params.lesson_decide
    - id: remote.start
      binding: verified
      routes: ["POST /workspace/remote/start"]
      params_schema: params.remote_control
      fixed_parameters: { action: start }
    - id: remote.refresh
      binding: verified
      routes: ["POST /workspace/remote/refresh"]
      params_schema: params.remote_control
      fixed_parameters: { action: refresh }
    - id: remote.stop
      binding: verified
      routes: ["POST /workspace/remote/stop"]
      params_schema: params.remote_control
      fixed_parameters: { action: stop }
    - id: device.pair
      binding: reserved
      executor: local_console
      human_evidence: LOCAL_ENROLLMENT_PRESENCE
      stage0b_evidence: LOCAL_ENROLLMENT_PRESENCE
      pending_expiry: 5m
      params_schema: params.device_pair
      note: >-
        Device enrollment: registering a credential (a passkey or a device key) with the issuer.
        No route in this repository performs that enrollment, so the row carries no route and no
        handler yet. The desk's browser-session pairing is a different effect and has its own row
        (`session.pair`): it creates a local browser session from a code typed at the local
        console, and it enrolls no credential.
    - id: device.remove
      binding: candidate
      params_schema: params.device_remove
      note: "Removing a paired device, including a session that is not the caller's own, stays governed. It is not session.logout."
    - id: device.recover
      binding: reserved
      executor: local_console
      human_evidence: RECOVERY_CODE_PRESENCE_FRESH_PASSKEY
      pending_expiry: 5m
      params_schema: params.device_recover
    - { id: expert.install, binding: candidate, params_schema: params.expert_install }
    - { id: expert.configure, binding: candidate, params_schema: params.expert_configure }
    - { id: expert.answer, binding: candidate, params_schema: params.expert_answer }
    - { id: expert.remove, binding: candidate, params_schema: params.expert_remove }
    - { id: grant.create, binding: reserved, params_schema: params.grant_create, authority_writer: sea_forge }
    - { id: grant.revoke, binding: reserved, params_schema: params.grant_revoke, authority_writer: sea_forge }
    - { id: gauntlet.run.cancel, binding: reserved, params_schema: params.run_cancel, authority_writer: sea_forge }
    - id: trust.rotate
      binding: reserved
      executor: local_console
      human_evidence: ADMIN_PRESENCE_INDEPENDENT_ADMIN
      pending_expiry: 30m
      params_schema: params.trust_rotate
      authority_writer: issuer_root
    - id: grant.redelegate
      binding: reserved
      executor: agent_execution_or_human_session
      params_schema: params.grant_redelegate
      authority_writer: sea_forge
      human_evidence: AGENT_NONE_HUMAN_A3_UV
      pending_expiry: parent_grant_expiry_or_10m
      note: >-
        Narrowing only. An agent caller is gated by the parent's redelegate permission, remaining
        depth, and ancestor budget; a human caller needs A3-UV and a current SEA-Forge entitlement
        to redelegate the named live parent, since a human session has no delegation head.

  P3:
    - id: approval.approve
      binding: reserved
      params_schema: params.approval
      authority_writer: sea_forge
      separation_of_duty: true
      pending_expiry: 10m
      note: "The approver is distinct from the initiating human, the requesting execution, and the executor. The pending window is the policy's ten minutes (pending_approval_ttl), not the P3 default's open-ended one: an approval that is not consumed inside it is expired and the operation must be requested again."
    - id: approval.reject
      binding: reserved
      params_schema: params.approval
      authority_writer: sea_forge
      separation_of_duty: true
      pending_expiry: 10m
      note: "A rejection expires on the same ten-minute pending window as an approval (pending_approval_ttl)."
    - id: external.commit
      binding: reserved
      executor: agent_execution
      params_schema: params.external_commit
      authority_writer: sea_forge
      human_evidence: PER_TARGET_ROW
      pending_expiry: grant_expiry
    - id: workspace.export
      binding: verified
      routes: ["POST /workspace/export"]
      params_schema: params.workspace_export
      pending_expiry: 15m
      authority_writer: sea_forge
    - id: isolation.request
      binding: reserved
      executor: agent_execution
      params_schema: params.isolation_request
      authority_writer: sea_forge
      human_evidence: NONE
      pending_expiry: grant_expiry
      note: "The capability gate fails closed with isolation_unavailable where the host prerequisites are not met."

  PX:
    - id: capability.invoke
      binding: reserved
      dispatcher: true
      params_schema: params.capability_invoke
      inherits: [class, executor, authority_writer, human_evidence, pending_expiry]
      note: "A family. The target operation ID, resource, amount, and effect are part of the descriptor and the resolved row. An unresolvable target is Px."
    - id: run.start
      binding: verified
      dispatcher: true
      routes: ["POST /desk/start"]
      params_schema: params.run_start
      inherits: [class, executor, authority_writer, human_evidence, pending_expiry]
      note: >-
        Resolves every target from the pinned plan. A plan whose targets are all local P0/P1
        resolves in Cognate with no grant and no SEA-Forge call; any governed target binds the
        whole run at the highest class present. The desk start route is this dispatcher and
        nothing else: it starts the waiting steps of a case, which is shared case execution, so
        it is not a P1 local write until its targets are resolved and every one of them is local.

# Routes that carry more than one semantic action. The applied operation is chosen by the
# handler from the action it actually performs. An action not listed here is Px, whatever the
# route is called and whatever class the request claims for itself.
dispatch:
  - route: "POST /agent/panels"
    action_field: tool
    actions:
      show_surface: agent.surface.publish
      ask_human: agent.question.ask
      arrange: agent.surface.arrange
      annotate: agent.surface.annotate
      read_responses: agent.response.read
      ask.withdraw: ask.withdraw
      answer.route: ask.route
    unknown_action: PX
    refused_prefixes: ["human."]
    note: >-
      The door refuses any human.* operation outright; a person's reserved operations are not
      reachable from an agent key at a stronger class.
  - route: "POST /desk/panels/op"
    action_field: op
    actions:
      human.answer: human.answer
      human.reassign_owner: ask.reassign
      human.stop_waiting: ask.withdraw
      human.pin: owner.pin
      human.open: human.panel.open
      human.close: human.panel.close
    unknown_action: PX
  - route: "POST /desk/search"
    action_field: record
    actions:
      "false_or_absent": horizon.search.read
      "true_with_non_empty_q": horizon.search.record
    # The literal values of `record` that select each action. `absent` means the field is not in
    # the body at all. Every other value is Px and is refused before the search runs, so an
    # unlisted action can never execute a read.
    action_values:
      false_or_absent:
        values: [absent, false, "0"]
      true_with_non_empty_q:
        values: [true, "1"]
        requires_non_empty_query: true
    unknown_action: PX
    note: >-
      Effect-based dispatch on one POST route: the read is P0 even though the method is POST,
      and the recorded find is the P1 write. The write path also performs the read, so a
      recorded find is governed by horizon.search.record alone.

# A route that is a transport alias of a listed operation. The alias adds no class and no
# authority; it may only narrow.
route_aliases:
  - route: "POST /workspace/intent"
    operation: horizon.surface.intent.commit
    target_class: P1
    basis: "Both handlers call commitSurfaceIntent; the effect is one committed surface intent."
    narrowing: >-
      /workspace/intent is strictly narrower: it hard-codes transport `gui` and the session's
      role `human`, and it additionally requires the action to be offered and available in the
      current frame with a matching frame revision.
    # The narrowing is stated as data so a check never has to read the prose above. Each entry
    # names one machine-checkable difference between this route and the route it stands in for;
    # a supplied value that disagrees with a fixed parameter is refused.
    fixed_parameters:
      transport: gui
      role: human
    narrowing_checks:
      - { kind: fixed_parameter, name: transport, equals: gui }
      - { kind: fixed_parameter, name: role, equals: human }
      - { kind: offered_action_required, name: action_id }
      - { kind: frame_revision_match, name: frame_revision }
    added_requirements: [transport_fixed_gui, role_fixed_human, offered_action_required, frame_revision_match]

live_enforcement:
  version: 1
  # The two authority paths, and the local-console ceremony. They are distinct, and no caller can
  # use the other one: a human session holds an entitlement and has no delegation head, while an
  # agent holds a live bounded grant and never holds an entitlement.
  paths:
    human_session:
      authority: >-
        A current SEA-Forge entitlement for the named operation, held by the durable human
        principal the issuer bound to this session.
      evidence: A3-UV
      note: >-
        A human session cannot hold a delegation grant, so it cannot be authorised by an agent's
        scope. The entitlement path is the only authority it has.
    agent_execution:
      authority: >-
        A live bounded delegation grant from SEA-Forge: the execution proof, the remaining depth,
        the remaining ancestor budget and the expiry.
      evidence: NONE
      note: >-
        The registered agent key is a caller identity, never an authority. The grant is the
        authority, and it is checked against the execution that presents it.
    local_console:
      authority: >-
        The one-time code shown at the local console. Possession of it is evidence for this local
        session only; it is not an assurance predicate and it grants no authority over anything
        else.
      evidence: NONE
      note: "The desk's browser-session ceremony. It creates one local session and enrolls no credential."
    none:
      authority: "No authority: the row has no effect to authorize."
      evidence: NONE
      note: "The public liveness probe."
  # One entry per live-bound row. `enforced_today` is a statement about this repository's running
  # code at the freeze, checked against the source. A row whose enforcement is missing says what
  # is missing and which stage must close it; it is never left implied by the class.
  rows:
    - id: horizon.health
      caller_path: none
      enforced_today: true
      enforced_by: >-
        The route answers before any authentication: an unpaired caller learns only that the world
        answers. It reports no identity, count or version.
      missing: []
    - id: horizon.economics.read
