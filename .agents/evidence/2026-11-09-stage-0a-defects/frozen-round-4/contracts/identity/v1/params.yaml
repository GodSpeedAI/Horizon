schemas_version: "horizon.identity.params/1"
contract_id: "horizon.identity.params"
contract_version: "1.0.0"
frozen_at: "2026-11-09"
authority:
  design: "design_draft.md Appendix A"
  spec: { id: "HORIZON-001", version: "1.2.0", sha256: "7b06f6b813462e08432b6e020e9266bdec625b2fee7140d4f2f52a774f9fa435" }

encoding_rules:
  integers: >-
    A record field that is a uint64 or a monetary decimal is a JSON string, never a JavaScript
    number. A *parameter* is declared with the type its value carries across the boundary: a
    JSON body field the handler reads as a number is `integer`, and a form field the handler
    reads as text is `uint64` or `string`. The two are never interchangeable, and a schema states
    which one a field is, so the confirmation digest is taken over the value the handler consumes.
  integer: "A JSON number that is a safe integer (|value| <= 2^53-1). Its canonical text is its shortest round-trip decimal form."
  wire: >-
    A record's `parameters` hold the names the values carry on the wire, so a confirmation digest
    binds the effect that actually happens and not a description of it. A schema states the wire
    name of a field when it differs from the contract's own name for it.
  nonce: "128-bit base64url, generated by the authority, never reused for another operation."
  timestamps: "RFC 3339 UTC."
  money: "decimal string with an explicit unit, never floating point."

# params_schema_ref is params.<operation_id with dots replaced by underscores> for every P2/P3 row,
# except the explicit aliases recorded below. An alias operation ID fixes action/resolution; a
# supplied value that disagrees with the operation ID is refused.
aliases:
  remote.start: params.remote_control
  remote.refresh: params.remote_control
  remote.stop: params.remote_control
  approval.approve: params.approval
  approval.reject: params.approval
  gauntlet.run.cancel: params.run_cancel
  case.task.decide: params.case_task_decide
  case.task.complete: params.case_task_complete
  decision.hold: params.decision_hold
  decision.release: params.decision_release
  horizon.settlement.observe: params.horizon_settlement_request
  horizon.settlement.rule: params.horizon_settlement_request

# P0 uses params.read and P1 uses params.local_write by default. A row with its own effect
# declares its own ref here, as Appendix A requires of an operation-specific P1 row at 0A.
operation_specific:
  horizon.search.read: params.horizon_search_read
  agent.response.read: params.agent_response_read
  horizon.search.record: params.horizon_search_record
  session.logout: params.session_logout
  session.pair: params.session_pair
  agent.surface.publish: params.agent_surface_publish
  agent.surface.arrange: params.agent_surface_arrange
  agent.surface.annotate: params.agent_surface_annotate
  agent.question.ask: params.agent_question_ask
  human.panel.open: params.human_panel_open
  human.panel.close: params.human_panel_close
  horizon.health: params.horizon_health
  horizon.diagnostics.read: params.horizon_diagnostics_read
  remote.health: params.remote_health
  remote.state.read: params.remote_state_read
  remote.events.read: params.remote_events_read
  remote.pair.redeem: params.remote_pair_redeem
  remote.session.challenge: params.remote_session_challenge
  remote.session.authenticate: params.remote_session_authenticate
  remote.session.logout: params.remote_session_logout
  horizon.economics.read: params.horizon_economics_read
  horizon.remote.status: params.horizon_remote_status
  horizon.navigation.intent.commit: params.horizon_navigation_intent_commit
  horizon.surface.intent.commit: params.horizon_surface_intent_commit
  horizon.note.save: params.horizon_note_save
  horizon.draft.save: params.horizon_draft_save
  horizon.conversation.discard: params.horizon_conversation_discard
  horizon.case.open: params.horizon_case_open
  horizon.lesson.propose: params.horizon_lesson_propose
  horizon.onboarding.skip: params.horizon_onboarding_skip
  horizon.onboarding.resume: params.horizon_onboarding_resume
  horizon.workspace.presenting: params.horizon_workspace_presenting

# type notation: string | uint64 | integer | json | decimal | timestamp | boolean | jwk |
#                string_array | object | object_array | string_or_string_array
# required: every listed field is required unless marked optional. null is only allowed where
# `nullable: true` is stated.
#
# A schema for a row with a live handler names exactly the parameters that handler consumes, and
# nothing else. `wire` gives the field's name on the wire, so the digest is taken over the same
# values the handler reads and an A3 confirmation can bind the effect that actually happens. A
# field the handler does not read is not in the schema; a field the handler requires and the
# schema omits is a defect, and `scripts/check-param-schema-binding.ts` fails on either.
# `variants` says that the row's effect is chosen by the code operation rather than by a field:
# the desk route and the agent door take different parameters for the same row.
schemas:
  params.read:
    fields:
      - { name: target_ref, type: string }
      - { name: query, type: string, nullable: true }
      - { name: expected_revision, type: uint64, nullable: true }

  params.local_write:
    fields:
      - { name: target_ref, type: string }
      - { name: expected_revision, type: uint64 }
      - { name: value, type: json }

  params.human_answer:
    fields:
      - { name: panel_id, wire: panel, type: string }
      - { name: ask_id, wire: ask, type: string }
      - { name: outcome, type: string, enum: ["answered", "deferred", "cancelled"] }
      - { name: value, type: string_or_string_array }
      - { name: version, type: string, note: "The question version the person saw: 14 lowercase hex characters." }
      - name: owner_rev
        type: integer
        note: >-
          The owner revision the person saw. The handler reads a JSON number and refuses a
          fractional or negative value, so the schema declares an integer and not a decimal
          string; the digest is taken over the number the handler consumes.
      - { name: note, type: string, nullable: true, optional: true }

  params.ask_route:
    fields:
      - { name: panel_id, wire: panel_id, type: string }
      - { name: ask_id, wire: ask_id, type: string }
      - { name: routed_as, wire: routed_as, type: string }

  params.ask_reassign:
    fields:
      - { name: panel_id, wire: panel, type: string }
      - { name: ask_id, wire: ask, type: string }
      - { name: from_key_id, type: string, nullable: true, note: "The owner the person saw. Null names an answer with no recorded owner." }
      - { name: to_key_id, type: string }
      - { name: confirmed, type: boolean, note: "The person's second confirm, echoing the owner they saw." }

  params.ask_withdraw:
    discriminated_by: code_op
    variants:
      human.stop_waiting:
        fields:
          - { name: step, wire: step, type: string }
      ask.withdraw:
        fields:
          - { name: panel_id, wire: panel_id, type: string }
          - { name: ask_id, wire: ask_id, type: string }
          - { name: reason, wire: reason, type: string }

  params.owner_pin:
    fields:
      - { name: panel_id, wire: id, type: string }
      - { name: pinned, wire: pinned, type: boolean }

  params.workspace_label:
    fields:
      - { name: session_id, wire: session, type: string }
      - { name: event_id, wire: event, type: string }
      - { name: record_seq, wire: record_seq, type: uint64, nullable: true }
      - { name: verdict, wire: verdict, type: string, nullable: true }
      - { name: first_failure, wire: first_failure, type: string }
      - { name: return_to, wire: return, type: string, optional: true, note: "Where the browser returns after the label; navigation only." }

  params.handoff_send:
    fields:
      - { name: draft_id, wire: draft_id, type: string }
      - { name: text, wire: text, type: string }
      - { name: case_id, wire: case_id, type: string }
      - { name: review, wire: review, type: object, object_fields: [{ name: step_id, type: string }], note: "The step whose finished work the hand off asks the recipient to review." }
      - { name: also_starts, wire: also_starts, type: string_array, optional: true, note: "The other steps the person saw waiting to start; a mismatch refuses the hand off as out of date." }
      - { name: plan_precondition, wire: plan_precondition, type: object, object_fields: [{ name: ref, type: string }, { name: expected_digest, type: string }], note: "The case version the person looked at; without it the hand off is not tied to what they saw." }
      - { name: assign, wire: assign, type: boolean, optional: true, note: "Whether the handed-off step is assigned to an agent." }

  # The decision route carries one body and several effects. The card kind is resolved by the
  # server from the card the decision names, and the choice comes from the body; the pair chooses
  # the operation. Each effect therefore has its own schema, and each schema pins the choices that
  # belong to that effect: a lesson card is accepted or rejected, a hold is a hold, and a release
  # is a release. A body that names a choice the effect does not have is refused.
  params.lesson_decide:
    fields:
      - { name: card_id, wire: card_id, type: string }
      - { name: choice, wire: choice, type: string, enum: ["accept", "reject"] }
      - { name: preview_code, wire: preview_code, type: string }
      - name: records
        type: array
        items:
          type: object
          object_fields:
            - { name: ref, type: string }
            - { name: expected_digest, type: string }
      - { name: reason, wire: reason, type: string, optional: true, note: "Why the person decided; a reason the rules refuse is refused with the decision." }
    rule: >-
      The lesson card's two decisions. The records are the versions the decision applies to: each
      with its ref and the digest the person saw. The handler drops an entry that does not carry
      both, so an empty list means the decision named no version.
    alias_rule: "The choice is fixed by the operation the card kind resolves to; a disagreeing value is refused."

  params.case_task_complete:
    fields:
      - { name: card_id, wire: card_id, type: string }
      - { name: choice, wire: choice, type: string, enum: ["accept"] }
      - { name: preview_code, wire: preview_code, type: string }
      - name: records
        type: array
        items:
          type: object
          object_fields:
            - { name: ref, type: string }
            - { name: expected_digest, type: string }
      - { name: reason, wire: reason, type: string }
    rule: >-
      The person marks their own step done. The reason is required: the case keeper records it
      with the completion. The records are the case version the person looked at, and the step is
      refused when that version no longer holds.
    alias_rule: "The choice is fixed by the operation the card kind resolves to; a disagreeing value is refused."

  params.case_task_decide:
    fields:
      - { name: card_id, wire: card_id, type: string }
      - { name: choice, wire: choice, type: string, enum: ["accept", "reject"] }
      - { name: preview_code, wire: preview_code, type: string }
      - name: records
        type: array
        items:
          type: object
          object_fields:
            - { name: ref, type: string }
            - { name: expected_digest, type: string }
      - { name: reason, wire: reason, type: string, optional: true }
    rule: >-
      The case keeper's own approval. The records are the preconditions the decision was taken
      under: the case keeper refuses a decision whose preconditions no longer hold.
    alias_rule: "The choice is fixed by the operation the card kind resolves to; a disagreeing value is refused."

  params.decision_hold:
    fields:
      - { name: card_id, wire: card_id, type: string }
      - { name: choice, wire: choice, type: string, enum: ["hold"] }
      - { name: preview_code, wire: preview_code, type: string }
      - name: records
        type: array
        items:
          type: object
          object_fields:
            - { name: ref, type: string }
            - { name: expected_digest, type: string }
      - { name: reason, wire: reason, type: string }
    rule: >-
      Holding a card changes nothing the card waits for: the step keeps waiting and the person
      releases the hold when they are ready. A hold without a reason is refused, and a reason the
      rules refuse is refused with the hold. The decision route carries one body, so the hold
      carries the same fields the other decisions do; only the choice belongs to the hold.

  params.decision_release:
    fields:
      - { name: card_id, wire: card_id, type: string }
      - { name: choice, wire: choice, type: string, enum: ["release"] }
      - { name: preview_code, wire: preview_code, type: string }
      - name: records
        type: array
        items:
          type: object
          object_fields:
            - { name: ref, type: string }
            - { name: expected_digest, type: string }
      - { name: reason, wire: reason, type: string, optional: true }
    rule: >-
      Releasing a hold puts the card back under Needs you. A card that is not on hold is refused.
      The decision route carries one body, so the release carries the same fields the other
      decisions do; only the choice belongs to the release, and a release carries no reason.

  # The approval rows. The desk's decision body names the card the escalation is on and the
  # choice the person made; the operation ID fixes which of the two it was, so a body whose
  # choice disagrees with the operation is refused.
  params.approval:
    fields:
      - { name: card_id, wire: card_id, type: string }
      - { name: choice, wire: choice, type: string, enum: ["accept", "reject"] }
      - { name: preview_code, wire: preview_code, type: string }
      - name: records
        type: array
        items:
          type: object
          object_fields:
            - { name: ref, type: string }
            - { name: expected_digest, type: string }
      - { name: reason, wire: reason, type: string, optional: true }
    alias_rule: >-
      The choice is fixed by the operation ID: `approval.approve` fixes `accept` and
      `approval.reject` fixes `reject`. A disagreeing value is refused rather than honoured.

  params.remote_control:
    fields:
      - { name: action, type: string, enum: ["start", "refresh", "stop"] }
    alias_rule: >-
      The action is fixed by the route and the operation ID; the request carries no parameter at
      all, so the only value the digest can carry is the fixed one. A supplied action that
      disagrees with the operation ID is refused.
    rule: >-
      The remote's routes take no parameter: the operation ID fixes the action, and each row
      declares that fixed value. The field is named here so the fixed value has one home.

  params.device_pair:
    fields:
      - { name: ticket, type: string }
      - { name: credential, type: json }
    rule: >-
      The device enrollment the phone completes: the ticket the redeemed pairing code issued, and
      the WebAuthn registration the phone's authenticator produced. The route verifies the
      registration against the ticket's challenge before it enrols anything.

  params.device_remove:
    fields:
      - { name: device_ref, type: string }
      - { name: expected_revision, type: uint64 }

  params.device_recover:
    discriminator: via
    variants:
      code_console:
        fields:
          - { name: recovery_code, type: string }
          - { name: new_credential_id, type: string }
          - { name: public_key, type: jwk }
        requires: "local console presence and a fresh passkey enrollment"
      paired_device:
        fields:
          - { name: approving_device_ref, type: string }
          - { name: new_credential_id, type: string }
          - { name: public_key, type: jwk }
        requires: >-
          A3-UV from an already-paired device that is not the device being replaced, plus a fresh
          passkey enrollment.
        rule: "approving_device_ref must name an already-paired device that is not the device being replaced."

  params.expert_install:
    fields:
      - { name: expert_id, type: string }
      - { name: manifest_ref, type: string }
      - { name: public_key, type: jwk }
      - { name: expected_revision, type: uint64 }

  params.expert_configure:
    fields:
      - { name: expert_id, type: string }
      - { name: config, type: json }
      - { name: expected_revision, type: uint64 }

  params.expert_answer:
    fields:
      - { name: expert_id, type: string }
      - { name: ask_id, type: string }
      - { name: value, type: string_or_string_array }
      - { name: expected_revision, type: uint64 }

  params.expert_remove:
    fields:
      - { name: expert_id, type: string }
      - { name: reason, type: string }
      - { name: expected_revision, type: uint64 }

  params.grant_create:
    fields:
      - { name: sponsor_ref, type: string }
      - { name: agent_ref, type: string }
      - { name: operations, type: string_array }
      - { name: resources, type: string_array }
      - { name: budget, type: object, object_fields: [{ name: amount, type: decimal }, { name: unit, type: string }] }
      - { name: audience, type: string }
      - { name: expires_at, type: timestamp }
      - { name: depth_remaining, type: uint64 }
      - { name: redelegate, type: boolean }
      - { name: offline, type: boolean }
    rule: "sponsor_ref is a declaration checked against the authenticated human session, never a source of identity."

  params.grant_revoke:
    fields:
      - { name: grant_ref, type: string }
      - { name: reason, type: string }
      - { name: expected_revision, type: uint64 }

  params.grant_redelegate:
    fields:
      - { name: parent_ref, type: string }
      - name: child
        type: object
        object_fields:
          - { name: agent_ref, type: string }
          - { name: operations, type: string_array }
          - { name: resources, type: string_array }
          - { name: budget, type: object, object_fields: [{ name: amount, type: decimal }, { name: unit, type: string }] }
          - { name: expires_at, type: timestamp }
          - { name: depth_remaining, type: uint64 }
    rule: >-
      parent_ref is a declaration checked against the authenticated caller. For an agent caller it
      must be that execution's own live delegation head; for a human caller the principal's current
      SEA-Forge entitlement to redelegate the named live parent is verified. A child field that is
      absent grants nothing.

  params.run_cancel:
    fields:
      - { name: run_ref, type: string }
      - { name: reason, type: string }
      - { name: expected_revision, type: uint64 }

  params.trust_rotate:
    fields:
      - { name: new_root_ref, type: string }
      - { name: reason, type: string }

  params.capability_invoke:
    fields:
      - name: target_operation
        type: string
        nullable: true
        note: >-
          The operation the invocation resolves to. A dispatcher that names no target resolves to
          nothing, so the null is the absence and the dispatcher rule refuses it.
      - { name: parameters, type: json }
      - { name: resource_refs, type: string_array }
      - { name: amount, type: object, nullable: true, object_fields: [{ name: value, type: decimal }, { name: unit, type: string }] }
      - { name: idempotency_key, type: string }

  params.external_commit:
    fields:
      - { name: target_operation, type: string }
      - { name: parameters, type: json }
      - { name: resource_refs, type: string_array }
      - { name: amount, type: object, object_fields: [{ name: value, type: decimal }, { name: unit, type: string }] }

  params.run_start:
    discriminator: caller_kind
    variants:
      agent_execution:
        fields:
          - { name: case_id, type: string }
          - { name: also_starts, type: string_array }
          - { name: grant_ref, type: string, nullable: true }
        rule: >-
          The caller names the case and the steps it previewed; the handler resolves the plan and
          checks that the preview still matches. grant_ref names the live grant the run spends.
          entitlement_ref is never caller-supplied.
      human_session:
        fields:
          - { name: case_id, type: string }
          - { name: also_starts, type: string_array }
        rule: >-
          The caller names the case and the steps it previewed; the handler resolves the plan and
          checks that the preview still matches. A human-session request that carries grant_ref is
          refused rather than ignored: no grant is fabricated, defaulted, or synthesized to satisfy
          a shared schema. The field is not part of this variant because a human session holds no
          delegation head; the delegation-reference register sees the name and refuses it, and the
          schema refuses it as a field the effect does not have.

  params.workspace_export:
    fields:
      - { name: kind, type: string, enum: ["labels", "comparison"] }
      - { name: standins, type: string, optional: true, note: "How the exported names stand in for the real ones; absent means no stand-ins." }
      - { name: source, type: string, optional: true, note: "The record source the comparison is read from." }
      - { name: day, type: string, optional: true, note: "The day the comparison covers." }
      - { name: only, type: string, optional: true, note: "Set to `contradicted` to export only the contradicted sessions." }
      - { name: repo, type: string, optional: true, note: "The repository the comparison is read from." }
      - { name: session, type: string, optional: true, note: "The session the comparison covers." }
      - { name: label_error, type: string, optional: true, note: "A label error carried from an earlier save; it is shown in the export and never changes what is exported." }

  params.isolation_request:
    fields:
      - { name: operation_ref, type: string }
      - { name: isolation_class, type: string, enum: ["isolated"] }

  # -------- reconciled rows: operation-specific refs declared at 0A (Appendix A) --------

  params.horizon_search_read:
    fields:
      - { name: q, type: string, nullable: true }
      - { name: day, type: string, nullable: true }
      - { name: tag, type: string, nullable: true }
    rule: "A find. Reads the caller's own scope and writes nothing; the method is POST and the effect is not a write."

  params.horizon_search_record:
    fields:
      - { name: q, type: string }
      - { name: day, type: string, nullable: true }
      - { name: tag, type: string, nullable: true }
      - { name: record, type: boolean, enum: [true] }
    rule: >-
      The recorded find. `record` is fixed true and `q` must be non-empty; with `record` absent or
      false the request is horizon.search.read and the class does not rise. The write is one
      conversation row in the caller's own scope.

  params.agent_response_read:
    fields: []
    allows_empty: true
    rule: "Takes no parameters. The scope is the authenticated agent key: an agent reads only the answers to the questions that key put up."

  params.session_pair:
    fields:
      - { name: code, wire: code, type: string, note: "The one-time code shown at the local console and typed into the browser. Possession evidence for this local session only: it is not an assurance predicate." }

  params.session_logout:
    fields: []
    allows_empty: true
    rule: >-
      Takes no parameters. The session ended is the one named by the caller's own authenticated
      cookie; a target session or device reference is not part of this schema and is refused.

  params.agent_surface_publish:
    fields:
      - name: surface
        type: object
        object_fields:
          - { name: id, type: string }
          # The handler accepts an absent title and refuses a null one; `step` accepts both an
          # absent value and a null one. Optionality and nullability are separate facts, and the
          # contract says which is which.
          - { name: title, type: string, optional: true }
          - { name: step, type: string, nullable: true, optional: true }
          # The blocks are a list. A block's own shape is the surface vocabulary's, not this
          # contract's, so the item is carried as an opaque JSON value.
          - { name: blocks, type: array, items: { type: json } }
    rule: >-
      A surface id names one panel. An update is refused unless the caller's key owns the panel,
      a question keeps its wording, and a question the person answered comes back unchanged.

  params.agent_surface_arrange:
    fields:
      - name: action
        type: object
        object_fields:
          - { name: op, type: string, enum: ["surface.remove", "view.focus", "view.place"] }
          - { name: id, type: string }
    rule: >-
      Only surface.remove writes, and only on a panel the caller's key owns whose every question
      is that key's, and never on a pinned panel. The other sub-actions are observed no-ops:
      focus and placement are the person's.

  params.agent_surface_annotate:
    fields:
      - { name: panel, type: string }
      - { name: text, type: string }
      # The handler accepts an absent tone and refuses a null one.
      - { name: tone, type: string, optional: true }
    rule: "The panel must exist and be owned by the caller's key; at the note limit the note is refused and the panel is unchanged."

  params.agent_question_ask:
    fields:
      - { name: panel, type: string }
      - name: ask
        type: object
        object_fields:
          - { name: id, type: string }
          - { name: question, type: string }
          # The input kind is optional: an absent one means a single-choice question. A present
          # one must be one of the four kinds the surface vocabulary declares.
          - { name: input, type: string, optional: true, enum: ["select", "multiselect", "confirm", "text"] }
          - { name: why_needed, type: string, optional: true }
          # The options are a list of option objects. An absent list is an empty list, and a null
          # one is refused: the handler never treats a null as "no options".
          - name: options
            type: array
            optional: true
            items:
              type: object
              object_fields:
                - { name: option_id, type: string }
                - { name: label, type: string, optional: true }
                - { name: consequence, type: string, optional: true }
          # The step a question settles may be absent, null or named.
          - { name: resolves, type: string, nullable: true, optional: true }
      - { name: step, type: string, nullable: true, optional: true }
    rule: >-
      Proposing a question grants nothing. `resolves` names the step the question settles; a
      question that names a required step cannot be withdrawn by the agent, and the person's
      answer stays a P2 decision.

  params.human_panel_open:
    fields:
      - { name: template, type: string }
      # The handler accepts an absent title and refuses a null one.
      - { name: title, type: string, optional: true }
    rule: "Opens a person-owned panel from a closed template; the id is derived from the template, so the same template always gives the same panel."

  params.human_panel_close:
    fields:
      - { name: panel_id, wire: id, type: string }
    rule: "Closes a panel on the person's board. Closing is not answering: the question's state is untouched."

  # --- The live P0/P1 handlers, each with its own schema. -------------------------------
  # A local write's fields are as binding as a governed row's: the schema says what the
  # handler reads, so the record that describes the operation describes the one that runs.
  # A field is required when the handler refuses the request without it.
  params.horizon_health:
    rule: >-
      The public liveness probe takes no parameter. It answers before any session exists and reads
      no caller input. It says the process is up and nothing else: the deployment profile, the
      operator reference, the semantic world, the research state and the transports are the
      authenticated diagnostics read's business, not the probe's.
  params.horizon_settlement_request:
    fields:
      - { name: intent_id, type: string }
      - { name: phase, type: string, enum: ["observe", "rule"] }
    rule: >-
      One settlement, one phase. The observation sends the evidence to the case keeper and
      decides nothing; the ruling asks the case keeper to rule and its answer is final. The phase
      is fixed by the operation the card or the command resolves to, and a disagreeing value is
      refused.

  params.horizon_diagnostics_read:
    rule: >-
      The authenticated diagnostics read takes no parameter. It reports the deployment profile, the
      operator reference, the semantic world, the research state and the transports to a paired
      caller, and writes nothing.
  params.horizon_economics_read:
    rule: "The economics read takes no parameter. It reads the store through its own reader and writes nothing."
  params.horizon_remote_status:
    rule: "The remote status read takes no parameter. It reports the transport's state and changes nothing."
  params.horizon_navigation_intent_commit:
    fields:
      - { name: operation_ref, type: string }
      - { name: expected_outcome, type: json, nullable: true, optional: true }
    rule: >-
      The intent names the operation it commits. `expected_outcome` is the bound operation's
      expectation, and it is refused for an operation that is not bound, never ignored.
  params.horizon_surface_intent_commit:
    fields:
      - { name: transport, type: string, enum: ["gui", "cli", "mcp"] }
      - { name: node_id, type: string, optional: true }
      - { name: operation, type: string, optional: true }
      - { name: frame_id, type: string, optional: true }
      - { name: intent_id, type: string, optional: true }
    rule: >-
      The surface intent names the transport and either the node the operator activated (gui) or
      the operation the caller named (cli/mcp). The role is absent by design: it comes from the
      signed-in session, never from the body (DEF-ROLE-FROM-REQUEST).
  params.horizon_note_save:
    fields:
      - { name: body, type: string }
      - { name: case_ref, type: string, nullable: true, optional: true }
      - { name: tags, type: string_array, optional: true }
      - { name: links, type: object_array, optional: true }
      - { name: note_id, type: string, optional: true }
      - { name: shared_with_agents, type: boolean, optional: true }
    rule: >-
      A note save edits the caller's own note. `note_id` is present when the save edits an
      existing note; `shared_with_agents` is the person's own choice and defaults to no.
  params.horizon_draft_save:
    fields:
      - { name: draft_id, type: string }
      - { name: text, type: string }
      - { name: mode, type: string, optional: true }
    rule: "A draft is the caller's own text. `mode` is the caller's choice of how it is kept."
  params.horizon_conversation_discard:
    fields:
      - { name: row_id, type: string }
    rule: "Discards one conversation row the caller owns, named by its own id."
  params.horizon_case_open:
    fields:
      - { name: purpose, type: string }
    rule: "The person's reason for opening the case. It is required: an empty purpose is refused."
  params.horizon_lesson_propose:
    fields:
      - { name: text, type: string }
      - { name: source, type: string, optional: true }
      - { name: proposed_by, type: string, optional: true }
    rule: >-
      A lesson is proposed, never decided. The text is required; the source and the proposer are
      the caller's own and default when absent.
  params.horizon_onboarding_skip:
    rule: "Skipping the onboarding step takes no parameter. The step is the caller's own."
  params.horizon_onboarding_resume:
    rule: "Resuming the onboarding step takes no parameter. The step is the caller's own."
  # --- The remote controller's routes. ---------------------------------------------------
  # The phone reaches the desktop over its own loopback transport. Its routes are catalogued
  # here too: a route that is not in the catalog is not a lesser operation, it is an uncatalogued
  # one, and the third independent review found exactly that gap.
  params.remote_health:
    rule: "The remote's liveness probe takes no parameter. It answers before any device is paired and reads no caller input."
  params.remote_state_read:
    rule: "The phone's home read takes no parameter. It reads the canonical reads the cockpit makes and writes nothing."
  params.remote_events_read:
    rule: "The phone's event stream takes no parameter. It opens the stream for the signed-in device and writes nothing."
  params.remote_pair_redeem:
    fields:
      - { name: secret, type: string }
    rule: >-
      The one-time pairing code shown at the desktop's local console. Possession of it proves no
      identity; the code is single use and expires, and the route says so rather than pretending
      the caller is the person at the console.
  params.remote_session_challenge:
    rule: >-
      The sign-in challenge takes no parameter. It issues a single-use challenge for an enrolled
      device and reveals only whether a device is enrolled.
  params.remote_session_authenticate:
    fields:
      - { name: ticket, type: string }
      - { name: credential, type: json }
    rule: >-
      The WebAuthn assertion the phone's authenticator produced, and the ticket the challenge
      issued. The route verifies the assertion against the challenge and the enrolled device
      before it issues a session.
  params.remote_session_logout:
    rule: "The sign-out takes no parameter. The session it revokes is the one the caller presented."
  params.horizon_workspace_presenting:
    fields:
      # The name is quoted because a bare `on` is a boolean in YAML, and a schema whose field name
      # parses as `true` names no field at all.
      - { name: "on", type: string, optional: true }
      - { name: return_to, wire: return, type: string, nullable: true, optional: true }
    rule: >-
      The Presenting switch is the caller's own. `on` is the switch value and `return` is where
      the browser goes afterwards; both are optional because an absent value has a stated default.
