    changes: "A home view ordered by the shared mode-precedence selector, a keyboard command palette over the same frames, stable deep links pinning world/checkpoint/focus, a back/forward trail and guided first-run states."
    proves: "The observer always sees pending approvals, contradictions and in-flight work first; every navigation path is keyboard reachable, linkable and reversible; the palette emits the same intents as other renderers."
