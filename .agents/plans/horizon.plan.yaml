tasks:
  T00:
    title: "Start with Project Topology Architect: inspect, bind ruler, freeze formation constraints"
    initial_status: "ready"
    depends_on: []
    proof_level: "P2"
    confirmation: "builder_with_adversarial_teeth"
    settles: []
    changes: "A source-pinned, documented topology-formation record and donor/API inventory exists before any app scaffolding or new domain code."
    proves: "The authoritative project-topology-architect skill was loaded from the requested local path; spec status/identity, actual repository APIs, donor boundaries and unresolved ambiguities were checked."
    does_not_prove: "This only establishes a trustworthy ruler and topology input; it does not prove Horizon runtime behavior or authorize implementing a draft spec."
    hot_context:
      - "Source spec: .agents/specs/horizon.agent.spec.yaml"
      - "Root AGENTS.md and .agents/AGENTS.md"
      - "Canonical topology skill at ~/projects/project-topology-architect/skills/project-topology-architect/SKILL.md"
    steps:
      - "FIRST load ~/projects/project-topology-architect/skills/project-topology-architect/SKILL.md and follow Greenfield P0 and relevant references. Do not silently substitute the vendored Horizon copy if the specified path is unavailable; block and ask."
      - "Read Horizon spec/README, root and .agents/AGENTS.md; verify sha256, requirement count, diagram labels and whether the spec is approved/frozen. Record any approval gap and refrain from implementation until resolved."
      - "Inspect sibling stack checkouts by remote identity (see supporting_sources): building-with-cognate, Cognate origin/main vs local branch, DomainForge published vs local, SEA-Forge (sea-rs), Gauntlet, RealityTrace (sxr), Context Kernel, godspeed_agent, Product Actualizer cockpit, terminal-ui and sea-rs workbench components."
      - "Record stable vs proposed APIs, license obligations, source-of-truth map, open questions and the P0/P1/P1B/P1C/P2 formation contract without reordering the normative plan."
      - "Initialize machine-readable requirement ledger and establish per-task evidence/prereg roots; document actual CLI/gate versions and user-controlled env paths."
      - "Record version drift between local checkouts and pinned releases without fetching; ask the operator before any fetch."
      - "Verify Product Actualizer's Apache-2.0 LICENSE is committed at the revision Horizon will copy from; record it in the decision log."
      - "Decide and record the single home for developmental scoring and promotion rules (REQ-DEV-003): Python capability, or TypeScript port with godspeed_agent golden fixtures as oracle."
      - "Build the research migration manifest: godspeed_agent packages, scripts, configs, preregistrations, reports, ledgers and data with sizes and SHA-256, plus the cybernetic_nav MCP and godspeed-nav CLI tool inventory for REQ-RES-006."
      - "Confirm or revise .agents/reports/horizon-product-integration-register.yaml (product dispositions and first two products for VAR-007)."
      - "Check whether SEA-Forge exposes a non-granting evaluate over the wire; if not, record the upstream request and plan the deferred_to_invocation gate state (CLAIM-006)."
    gate:
      - "test -r .agents/specs/horizon.agent.spec.yaml && test -r .agents/plans/horizon.plan.yaml"
      - "sha256sum .agents/specs/horizon.agent.spec.yaml"
      - "git diff --check"
      - "test -r .agents/reports/horizon-product-integration-register.yaml"
    teeth:
      - attack: "Remove or falsify the requested topology skill path"
        expected: "Formation MUST block rather than proceed with an unverified different skill."
      - attack: "A preregistration says 'approved' while spec is still draft"
        expected: "No implementation task unlocks until explicit freeze and matching spec hash are recorded."
    redesign_trigger: "The canonical topology skill's structural contracts contradict the normative Horizon spec or its requested skill location cannot be read."
    evidence: ".agents/evidence/horizon/T00/"
    done_when:
      - "Every declared narrow gate ran and passed with retained exact output."
      - "Every deliberate negative/teeth case behaved as claimed."
      - "The task evidence includes touched refs, commands, results, and remaining unknowns."
      - "Applicable global gates remain green; no required test is skipped."
    preregistration:
      required: true
      artifact: ".agents/prereg/horizon/T00.prereg.yaml"
      claim: "The authoritative project-topology-architect skill was loaded from the requested local path; spec status/identity, actual repository APIs, donor boundaries and unresolved ambiguities were checked."
      falsifier: "Remove or falsify the requested topology skill path"
      known_confounds:
        - "Mocks and fixture-only results are not live settlement evidence."
        - "Pinned external API and skill versions may differ from prose documentation."
      confirmation_condition: "Builder demonstrates preregistered positive and negative checks with stable evidence and documents plausible alternate failures."
  T01:
    title: "Derive canonical DomainForge interaction model (topology P1)"
    initial_status: "blocked"
    depends_on:
      - "T00"
    proof_level: "P2"
    confirmation: "builder_with_adversarial_teeth"
    settles:
      - "REQ-STACK-001"
      - "REQ-WORLD-004"
      - "REQ-GOAL-001"
    changes: "Validated .sea Interaction Domain Model, semantic journey catalog, unknowns and translation map represent the five Horizon journeys without duplicating DomainForge authority."
    proves: "DomainForge's supported .sea and canonical composed world_ref encode stable observer, purpose, object, relationship, action, settlement and next-affordance distinctions."
    does_not_prove: "Does not prove operational object instance queries, Cognate bindings, UI, or actual work."
    hot_context:
      - "../cognate/.agents/skills/building-with-cognate/SKILL.md"
      - ".agents/skills/deriving-interaction-domain-models/SKILL.md"
      - ".agents/skills/domainforge-sea/SKILL.md"
    steps:
      - "Use canonical project-topology-architect P1, then Horizon's deriving-interaction-domain-models and domainforge-sea skills; load Cognate's building-with-cognate skill before defining app contracts."
      - "Derive .sea from canonical CognitiveOS references and the five J01–J05 spec journeys; preserve unknown capability, payment and authority details as unresolved rather than inventing syntax."
      - "Validate import closure and world identity using DomainForge actual installed CLI/binding; compare semantics against source spec, not just parse success."
      - "Capture canonicality conclusion, translation map, open questions, and immutable identity output."
      - "Include semantic modules for research artifacts (dataset, preregistration, experiment run, verdict, estimator) and for the product integration contract, plus one module per first product; keep each product module owned by that product where it already models itself."
    gate:
      - "domainforge validate .sea/interaction/interaction-model.sea --application"
      - "git diff --check"
    teeth:
      - attack: "Insert unsupported guessed .sea relation or capability"
        expected: "The model must fail validation or an explicit unrepresented semantics gate."
      - attack: "Treat a changed semantic closure as the same active world_ref"
        expected: "World identity comparison must show changed identity and demand explicit promotion."
    redesign_trigger: "The source semantics cannot be represented with supported .sea without losing payment, role, settlement or world-revision distinctions."
    evidence: ".agents/evidence/horizon/T01/"
    done_when:
      - "Every declared narrow gate ran and passed with retained exact output."
      - "Every deliberate negative/teeth case behaved as claimed."
      - "The task evidence includes touched refs, commands, results, and remaining unknowns."
      - "Applicable global gates remain green; no required test is skipped."
    preregistration:
      required: true
      artifact: ".agents/prereg/horizon/T01.prereg.yaml"
      claim: "DomainForge's supported .sea and canonical composed world_ref encode stable observer, purpose, object, relationship, action, settlement and next-affordance distinctions."
      falsifier: "Insert unsupported guessed .sea relation or capability"
      known_confounds:
        - "Mocks and fixture-only results are not live settlement evidence."
        - "Pinned external API and skill versions may differ from prose documentation."
      confirmation_condition: "Builder demonstrates preregistered positive and negative checks with stable evidence and documents plausible alternate failures."
  T02:
    title: "Project J01–J06 into Behavioral IR and prove the Clack journey (P1B)"
    initial_status: "blocked"
    depends_on:
      - "T01"
    proof_level: "P2"
    confirmation: "builder_with_adversarial_teeth"
    settles:
      - "REQ-INT-001"
      - "REQ-GOAL-002"
      - "REQ-NAV-004"
      - "REQ-CASE-001"
    changes: "Six separate Behavioral IRs with IS1–IS8, a runnable fixture-backed sequential proof and explicit missing-boundary records."
    proves: "A bounded observer can ask, inspect, choose, defer, reframe, or block each canonical journey without invented authority, payment or settlement."
    does_not_prove: "Fixtures do not prove production Cognate/SEA-Forge integrations or any durable external effect."
    hot_context:
      - ".agents/skills/deriving-behavioral-interaction-proofs/SKILL.md"
      - ".agents/specs/horizon.agent.spec.yaml"
    steps:
      - "Use deriving-behavioral-interaction-proofs skill PROVE mode for behavior fixtures; load its schemas and validator."
      - "Instantiate J01 explore, J02 operate, J03 build, J04 monitor, J05 compare and J06 develop with stable semantic refs and explicit authority/payment/recovery/evidence statuses; use the REQ-NAV-006 authority gate vocabulary."
      - "Exercise positive, blocked, unknown, conflicted, cancelled and contradicted routes with Clack-like one-decision-at-a-time prompts."
      - "Record projection-pressure findings, including required persistent focus, graph, comparison, timeline and evidence context."
    gate:
      - "python3 .agents/skills/deriving-behavioral-interaction-proofs/scripts/validate_behavioral_ir.py behavioral/journeys/*.yaml"
      - "git diff --check"
    teeth:
      - attack: "Remove approval or settlement binding from a consequential journey"
