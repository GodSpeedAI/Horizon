tasks:
  T00:
    title: "Start with Project Topology Architect: inspect, bind ruler, freeze formation constraints"
    initial_status: "ready"
    depends_on: []
    proof_level: "P2"
    confirmation: "builder_with_adversarial_teeth"
    settles: []
    changes: "A source-pinned, documented topology-formation record and donor/API inventory exists before any app scaffolding or new domain code."
    proves: "The authoritative project-topology-architect skill was loaded from the requested local path; spec status/identity, actual repository APIs, donor boundaries and unresolved ambiguities were checked."
    does_not_prove: "This only establishes a trustworthy ruler and topology input; it does not prove Horizon runtime behavior or authorize implementing a draft spec."
    hot_context:
      - "Source spec: .agents/specs/horizon.agent.spec.yaml"
      - "Root AGENTS.md and .agents/AGENTS.md"
      - "Canonical topology skill at ~/projects/project-topology-architect/skills/project-topology-architect/SKILL.md"
    steps:
      - "FIRST load ~/projects/project-topology-architect/skills/project-topology-architect/SKILL.md and follow Greenfield P0 and relevant references. Do not silently substitute the vendored Horizon copy if the specified path is unavailable; block and ask."
      - "Read Horizon spec/README, root and .agents/AGENTS.md; verify sha256, requirement count, diagram labels and whether the spec is approved/frozen. Record any approval gap and refrain from implementation until resolved."
      - "Inspect sibling GodSpeed stack checkouts and GitHub refs: Cognate's building-with-cognate skill, DomainForge, SEA-Forge, Gauntlet, RealityTrace, Context Kernel, existing godspeed_agent, Product Actualizer cockpit and scaffold capabilities."
      - "Record stable vs proposed APIs, license obligations, source-of-truth map, open questions and the P0/P1/P1B/P1C/P2 formation contract without reordering the normative plan."
      - "Initialize machine-readable requirement ledger and establish per-task evidence/prereg roots; document actual CLI/gate versions and user-controlled env paths."
    gate:
      - "test -r .agents/specs/horizon.agent.spec.yaml && test -r .agents/plans/horizon.plan.yaml"
      - "sha256sum .agents/specs/horizon.agent.spec.yaml"
      - "git diff --check"
    teeth:
      -
        attack: "Remove or falsify the requested topology skill path"
        expected: "Formation MUST block rather than proceed with an unverified different skill."
      -
        attack: "A preregistration says 'approved' while spec is still draft"
        expected: "No implementation task unlocks until explicit freeze and matching spec hash are recorded."
    redesign_trigger: "The canonical topology skill's structural contracts contradict the normative Horizon spec or its requested skill location cannot be read."
    evidence: ".agents/evidence/horizon/T00/"
    done_when:
      - "Every declared narrow gate ran and passed with retained exact output."
      - "Every deliberate negative/teeth case behaved as claimed."
      - "The task evidence includes touched refs, commands, results, and remaining unknowns."
      - "Applicable global gates remain green; no required test is skipped."
    preregistration:
      required: true
      artifact: ".agents/prereg/horizon/T00.prereg.yaml"
      claim: "The authoritative project-topology-architect skill was loaded from the requested local path; spec status/identity, actual repository APIs, donor boundaries and unresolved ambiguities were checked."
      falsifier: "Remove or falsify the requested topology skill path"
      known_confounds:
        - "Mocks and fixture-only results are not live settlement evidence."
        - "Pinned external API and skill versions may differ from prose documentation."
      confirmation_condition: "Builder demonstrates preregistered positive and negative checks with stable evidence and documents plausible alternate failures."
  T01:
    title: "Derive canonical DomainForge interaction model (topology P1)"
    initial_status: "blocked"
    depends_on:
      - "T00"
    proof_level: "P2"
    confirmation: "builder_with_adversarial_teeth"
    settles:
      - "REQ-STACK-001"
      - "REQ-WORLD-004"
      - "REQ-GOAL-001"
    changes: "Validated .sea Interaction Domain Model, semantic journey catalog, unknowns and translation map represent the five Horizon journeys without duplicating DomainForge authority."
    proves: "DomainForge's supported .sea and canonical composed world_ref encode stable observer, purpose, object, relationship, action, settlement and next-affordance distinctions."
    does_not_prove: "Does not prove operational object instance queries, Cognate bindings, UI, or actual work."
    hot_context:
