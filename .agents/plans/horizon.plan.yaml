      - "REQ-RES-004"
      - "REQ-RES-005"
      - "REQ-RES-006"
      - "REQ-RES-007"
    changes: "godspeed_agent dataset adapters, corpora builders, calibration pipeline, experiment matrices, shadow/guarded evaluation and predictive model port run as a Python subsystem invoked through Cognate, with research artifacts navigable as world objects and estimator activation governed."
    proves: "A migrated experiment reproduces its original verdict from hash-pinned data, a new governed run freezes its preregistration first, and an estimator cannot influence ranking without governed activation on a passed held-out criterion."
    does_not_prove: "Does not prove that agent-trajectory results transfer to Horizon operational episodes or that any estimator improves navigation."
    hot_context:
      - "~/projects/godspeed_agent/scripts/settlement_datasets"
      - "~/projects/godspeed_agent/godspeed_nav/ml.py"
      - "~/projects/godspeed_agent/.agents/reports"
      - "~/projects/godspeed_agent/mcp/cybernetic_nav_server/server.py"
      - "~/projects/godspeed_agent/HARNESS.md"
    steps:
      - "Move Python packages, scripts, configs, preregistrations, reports and tests per the T00 migration manifest with history and hashes; reference large data by hash and location."
      - "Define the typed process contract (run experiment, read results, evaluate estimator, export/import dataset) and bind it as Cognate capabilities."
      - "Reproduce v008 (SETTLED) and v007 (PARTIAL) from pinned data; record any discrepancy without upgrading claims."
      - "Make research artifacts navigable world objects with provenance; launch runs as governed operations with compute payment and frozen preregistration."
      - "Implement governed estimator activation and visible active/heuristic/disabled states; prove gate outcomes do not change (VAR-009)."
      - "Publish the cybernetic_nav and godspeed-nav mapping or deprecation table and keep a compatibility shim where agents depend on it."
      - "Keep the subsystem's pytest suite green under 'just test'."
    gate:
      - "just gate-t21"
      - "just verify"
    teeth:
      - attack: "Edit a frozen preregistration after the run starts"
        expected: "Mutation refused; a new candidate preregistration is required."
      - attack: "Activate an estimator whose held-out criterion failed"
        expected: "Activation denied; ranking unchanged; failure retained."
      - attack: "Migration relabels v007 PARTIAL as settled"
        expected: "Claim-level check fails the gate."
    redesign_trigger: "The research pipelines cannot run behind a process contract without duplicating Horizon's authority or evidence ledgers."
    evidence: ".agents/evidence/horizon/T21/"
    done_when: *id001
    preregistration:
      required: true
      artifact: ".agents/prereg/horizon/T21.prereg.yaml"
      claim: "Migrated research reproduces original verdicts at original claim levels, and estimators influence nothing without governed activation."
      falsifier: "Activate an estimator whose held-out criterion failed"
      known_confounds:
        - "Mocks and fixture-only results are not live settlement evidence."
        - "Pinned external API and skill versions may differ from prose documentation."
      confirmation_condition: "Fresh independent verifier reproduces the declared positive and adversarial boundary tests against pinned artifacts, reports verdict and evidence."
    independent_confirmation: *id002
