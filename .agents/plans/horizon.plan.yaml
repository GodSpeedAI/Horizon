metadata:
  id: "HORIZON-PLAN-001"
  title: "Horizon end-to-end semantic navigation, deterministic Clack + Atomic GUI and governed evidence"
  status: "draft"
  version: "0.1.0"
  created: "2026-10-19"
  purpose: "Project Horizon's normative specification into a dependency-correct settlement graph, beginning with the owner's canonical Project Topology Architect skill and a Cognate-native, Product Actualizer-informed application, with independent evidence for consequential claims."
source:
  spec:
    intended_repository_path: ".agents/specs/horizon.agent.spec.yaml"
    artifact_name: "horizon.agent.spec.yaml"
    spec_id: "HORIZON-001"
    spec_version: "0.1.0"
    sha256: "852e85e4a7b3ad613a98f1ef5f5fe6610f4543a9d39c5f58b290ccda170936bc"
    authority: "normative"
    current_status: "draft; T00 may perform preflight but T01+ cannot begin until this exact spec is explicitly approved/frozen"
  implementation_brief:
    intended_repository_path: ".agents/reports/implementation-context.md"
    authority: "non_normative_execution_context"
    status: "not_yet_authored; T00 creates concise pinned brief only if needed"
    conflict_rule: "Source spec governs. A conflict blocks affected work; do not silently resolve in code."
  supporting_sources:
    -
      path: "~/projects/project-topology-architect/skills/project-topology-architect/SKILL.md"
      role: "Owner-designated canonical greenfield topology workflow; load FIRST on executing machine"
    -
      path: "~projects/cognate/.agents/skills/building-with-cognate/SKILL.md"
      role: "Required Cognate implementation skill; resolve from workspace and inspect installed revision"
    -
      path: "~/projects/product-actualizer/cockpit"
      role: "Donor deterministic UI grammar, source binding, world debugger and pure reducer, not source of Horizon runtime truth"
    -
      path: "~/projects/godspeed_agent"
      role: "Existing GodSpeed observer/developmental implementation and tests to inspect before porting"
    -
      path: ".agents/skills/deriving-interaction-domain-models/SKILL.md"
      role: "Required canonical semantic derivation"
    -
      path: ".agents/skills/deriving-behavioral-interaction-proofs/SKILL.md"
      role: "Required Behavioral IR and Clack-like proof"
    -
      path: ".agents/skills/deriving-atomic-ui-models/SKILL.md"
      role: "Required renderer-neutral atomic UI derivation"
    -
      path: ".agents/skills/domainforge-sea/SKILL.md"
      role: "Required .sea grammar and CLI validation"
target_settlement: "From a clean checkout, an observer can load a real canonical composed DomainForge world via Cognate, find and traverse scoped operational objects, navigate purposeful Cases and affordable operations via Clack or Atomic GUI, perform a truly governed direct/Gauntlet action, read independent RealityTrace evidence, distinguish operational settlement from developmental interpretation, recover from interruption, and compare bounded hypothetical alternatives without fabricating world state. Every required claim has variation, adversarial and independent conformance evidence."
operating_contract:
  core_principle: "Project Topology Architect derives the substrate and acceptance ledger from frozen semantics; Building with Cognate realizes it; Product Actualizer donates deterministic presentation patterns only. Never make Horizon a parallel Cognate, SEA-Forge, DomainForge, or Product Model engine."
  rules:
    - "Begin T00 by reading the owner-designated topology skill at ~/projects/project-topology-architect/skills/project-topology-architect/SKILL.md; do not start by scaffolding or writing screens."
    - "Load the building-with-cognate skill before Cognate project creation/binding; its old 0.19.0 prose is not the installed 0.21.1 authority. Inspect code/CLI first."
    - "Keep spec draft/frozen status truthful: do not execute implementation tasks until the bound spec is explicitly approved and its SHA-256 matches."
    - "Execute by actual dependency DAG, not task numbering; parallel tasks may proceed only after shared prerequisites settle."
    - "No task is settled by code existence, logs alone, UI polish, skipped tests, a green mock or a tool acknowledgment."
    - "Independent P3 confirmation must not be faked by the builder checking their own tests. No isolated verifier means blocked."
    - "Follow Project Topology Architect P0/P1/P1B/P1C/P2–P8, preserve frozen semantic and execution references and reroute candidate revisions to higher-observer review."
    - "One source-of-truth home per fact; reuse Cognate runtime, DomainForge identity, SEA-Forge authority, RealityTrace evidence, Gauntlet execution."
    - "Use Bun/TypeScript and 'just' as the standard dev interface where supported; do not lock internal architecture before topology formation."
    - "Never import Product Actualizer's Product Model/router as Horizon runtime truth; check donor licenses and change attribution."
    - "Keep read-only world exploration usable when unrelated action/Context Kernel/agent integrations are degraded."
    - "Preserve original failures, cost, recovery and correction history, with clearly separated sources, observation and developmental claims."
  claim_states:
    - "OBSERVED"
    - "INFERRED"
    - "DECIDED"
    - "ASSUMED"
    - "UNKNOWN"
  correction_protocol:
    - "Preserve failed evidence, frozen acceptance criteria and original world_ref."
    - "Classify implementation vs oracle/test vs representation vs missing prerequisite vs environmental confound vs source-spec ambiguity."
    - "Correct smallest falsified layer; if spec/domain is wrong, STOP, propose candidate revision and seek explicit governing approval before re-freeze."
    - "Rerun original falsifier and confirmation; retain every negative round and re-confirm independently for P3."
    - "Never reduce acceptance or relabel simulation to make test pass."
  scope_control: "Scope additions require a normative requirement or a genuine blocking prerequisite. Separate attractive extras into .agents/DEBT.md; no new shadow runtime, abstract framework, or unproven simulator."
artifacts:
  current_status: ".agents/CURRENT_STATUS.jsonl (append-only complete snapshots; human mirror .agents/CURRENT_STATUS.md)"
  decision_log: ".agents/reports/horizon-decisions.yaml (created on first material decision)"
  evidence_root: ".agents/evidence/horizon"
  reports_root: ".agents/reports"
  preregistration_root: ".agents/prereg/horizon"
  status_rule: "Mutable status and reports are operational projections only and never override the spec or settled evidence. Respect .agents/AGENTS.md append/mirror protocol."
verification:
  global_gates:
    -
      id: "H-BUILD"
      command: "just check"
      available_after: "T04; before then use task-local structural gates"
    -
      id: "H-TEST"
      command: "just test"
      available_after: "T04"
    -
      id: "H-BOUNDARY"
      command: "just boundaries"
      available_after: "T04"
    -
      id: "H-VERIFY"
      command: "just verify"
      available_after: "T04"
  gate_binding_rule: "T04 MUST create a real, verified Justfile resolving only actual Bun/Cognate/DomainForge commands. Tasks T00–T03 use their explicit narrow gates because the app skeleton does not yet exist. Each subsequent task provides its 'just gate-tNN' target with real tests, and global gates reuse the same underlying checks; do not create fake green aliases."
  proof_levels:
    P0: "Deterministic structure check plus applicable global gates."
    P1: "Positive behavior, meaningful negative check and applicable global gates."
    P2: "Frozen or explicit claim, adversarial falsifier, retained evidence and credible alternate failure review."
    P3: "Frozen preregistration before work, builder evidence, adversarial attacks, independent fresh replay, correction/reconfirmation after failure."
