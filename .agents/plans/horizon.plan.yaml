        - "Pinned external API and skill versions may differ from prose documentation."
      confirmation_condition: "Builder demonstrates preregistered positive and negative checks with stable evidence and documents plausible alternate failures."
final_acceptance:
  canonical_world_and_navigation:
    - "One pin to DomainForge world_ref plus distinct operational checkpoint is preserved across all journeys."
    - "Object search, filter and relation traversal use real scoped Cognate instance projections, not a static demo."
  affordance_authority_and_evidence:
    - "No path is spendable if a visibility/reach/payment/authority/capability/recovery/settlement hard gate is unknown or false."
    - "SEA-Forge invocation governs exact effect; Gauntlet frozen Reference cannot mutate in-flight; independent RealityTrace evidence and operational settlement are not conflated."
  deterministic_interaction:
    - "Clack, GUI and command palette produce equivalent typed intents, same denial logic, same current-vs-historical/candidate semantics and replayable context."
    - "Closed declarative blocks and owner layout authority hold under adversarial agent-generated surfaces."
  developmental_recovery:
    - "A single pass, resource increase, simulation or trace receipt never causes a false capability promotion."
    - "Failure, contradiction, retry, recovery and payments survive correction and affect future navigational assessment."
  evidence_and_confirmation:
    - "Every REQUIRED spec requirement maps to at least one settled task and evidence record."
    - "Every P3 task has a separately retained fresh independent confirmation."
    - "Failed/correction evidence is preserved; skipped required live tests prevent whole-system conformance."
    - "All bound global gates are green against the released target; README and status do not exceed actual evidence."
  products_and_research:
    - "Two heterogeneous products join one world at derived integration levels with isolated failure."
    - "Migrated research reproduces original verdicts at original claim levels; estimators never alter hard gates and activate only under governance."
  operator_experience:
    - "Home view surfaces pending approvals, contradictions and in-flight work first; palette, deep links and trail work across journeys."
    - "Measured read-navigation latency and accessibility checks meet REQ-UX-008 and REQ-UX-009 on local_operator."
guardrails:
  - "Source spec and DomainForge semantic identity are immutable within an active frozen run; candidate revisions require new explicit freeze."
  - "Never reimplement DomainForge, Cognate durable event truth, SEA-Forge authority, Gauntlet execution or RealityTrace evidence in Horizon."
  - "Cognate's building-with-cognate skill and Project Topology Architect are mandatory; do not shortcut semantic derivation."
  - "Do not reuse Product Actualizer's local loopback authorization model for remote/multi-user Horizon."
  - "No executable UI generation, hidden mocks, false proof, unpriced spendability or premature operational/developmental success."
  - "Business data, code, agent text, citations, and tool responses are untrusted unless their owning boundary proves otherwise."
  - "Keep failed evidence, rollback instructions and original acceptance/falsification criteria visible."
handoff_contract:
  must_report:
    - "Settled capabilities and normative IDs with concrete evidence links."
    - "Unsettled/blocked/deferred tasks and missing prerequisites."
    - "Source hash/version, latest status revision, real execution environment and exact gate results."
    - "P3 confirmation verdicts and independent evidence."
    - "Requirement-to-evidence index, recovery/rollback, scope decisions and known limitations."
    - "Next executable task ID or 'none — plan settled' after final T19 only."
  settled_next_action_rule: "Only after T19 independently confirms all required proof may next action say 'none — plan settled'; otherwise report earliest dependency-ready unsettled task."
