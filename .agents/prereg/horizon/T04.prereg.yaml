preregistration:
  id: HORIZON-PREREG-T04
  task: T04
  title: Project Topology Architect walking skeleton with Cognate and selective Product Actualizer reuse
  recorded_at: "2026-10-19"
  recorded_before_artifacts: true

  claim: >-
    The project boots, parses and pins the canonical semantic world, resolves the
    local_operator configuration at a trusted boundary, and performs an honest
    structural source-to-intent-to-projection round-trip through real Cognate
    runtime and SQLite wiring, with no competing model or authority store.

  upstream_pins:
    spec: {id: HORIZON-001, version: 1.0.0, sha256: 75cfc1ceb9eec6139f7b8e73f8d1107fcc5e2b680e80683824edd7d8de434130}
    plan: {id: HORIZON-PLAN-001, file: .agents/plans/horizon.plan.yaml}
    world_ref: "world:horizon@sha256:6c18d6a608bd9d83e6aa354d5a8cc804009ca208562021c1736ee429412309f0"
    cognate: {version: 0.6.1, commit: a477933a1ddf1a8bcd64b4e762ccbb56e5fbd7d5}
    domainforge: {version: 0.21.1, bin: /home/sprime01/projects/domainforge/target/release/domainforge}
    product_actualizer: {commit: c9df8d2, license: Apache-2.0, role: donor-not-runtime-authority}

  pin_revision:
    original_world_ref: "world:horizon@sha256:b0f31fcc60f49af730ca0b863af8e0eae990924fd0beb1d004f10c602cd24ca1"
    revised_world_ref: "world:horizon@sha256:6c18d6a608bd9d83e6aa354d5a8cc804009ca208562021c1736ee429412309f0"
    reason: >-
      The IDM's INV-08 (inv_intent_idempotent) was bound to REQ-NAV-001, whose frozen
      text is about the possibility/availability distinction; INV-08 is about duplicate
      intent ids not duplicating external effects, which is REQ-INT-003. The
      requirement_ref was corrected to REQ-INT-003 during ledger generation. DomainForge
      derives the semantic closure hash from the source set, so this one-line semantic
      correction changes world_ref. No entity, invariant statement or operation changed.
    verified_by: >-
      `domainforge validate --application` reports 0 violations (4 operations, 8 records,
      16 enums, 24 entities) and `scripts/world-ref.py --expect <revised>` reports the
      identity unchanged for the revised source; `scripts/probe-world.ts` accepts the
      revised ref and rejects any other.
    rejected: >-
      Keeping the original pin. A pinned world_ref that no longer matches the canonical
      source is exactly the "stale world" the runtime must fail closed on; the test
      failure observed at T04 was the adapter correctly refusing it.

  positive_expectations:
    - id: PE-01
      expectation: >-
        The requirement ledger has non-placeholder semantic bindings, acceptance
        contracts that name observable outcomes, real freeze digests, and independent
        criticism verdicts recorded before the freeze; the Wayfinder cross-references
        every ledger requirement exactly.
    - id: PE-02
      expectation: >-
        `cognate create` (pinned 0.6.1) produces a starter whose dependency closure is
        reproducible, and Horizon's composition root boots a real Cognate runtime over
        a SQLite store rather than an in-memory substitute.
    - id: PE-03
      expectation: >-
        The semantic adapter loads the canonical `.sea` interaction model, reports the
        pinned world_ref and projected object counts, and fails closed on a mismatched
        or missing world.
    - id: PE-04
      expectation: >-
        A structural E2E drives source world -> typed frame/intent -> Cognate run ->
        projection/health observation using the real runtime; the result identifies the
        world_ref, checkpoint and correlation.
    - id: PE-05
      expectation: >-
        `local_operator` config binds loopback transports only, derives operator identity
        from the OS session, keeps agent principals distinct, generates per-launch
        secrets with restrictive permissions, and refuses `shared_remote` without an
        identity provider.
    - id: PE-06
      expectation: >-
        The Python research subsystem is its own uv project with a lock file, a typed
        process contract, and pytest coverage invoked by `just test`; no ML logic is
        claimed.
    - id: PE-07
      expectation: >-
        `just check`, `just boundaries`, `just verify` and `just gate-t04` exist and pass
        with retained output; `just test` does not skip the research contract gate.
    - id: PE-08
      expectation: >-
        The topology record names component units, one-way dependencies, adapter seams,
        frozen boundaries and explicitly open behavior, without copying another
        product's truth engine.

  falsifier: >-
    Remove the required Cognate project dependency or load a fake in-memory runtime and
    the structural E2E still passes; or accept a copy of Product Actualizer's process
    source as canonical Horizon world state.

  negative_expectations:
    - id: NE-01
      attack: Remove the required Cognate dependency from package metadata.
      expected: >-
        Structural/boundary check fails closed with a bounded diagnostic naming the
        missing Cognate package, never a mock fallback.
    - id: NE-02
      attack: Configure the runtime with an in-memory store under local_operator.
      expected: >-
        Runtime creation rejects it with a bounded diagnostic; structural E2E does not
        quietly pass.
    - id: NE-03
      attack: Create `product-model/` (or copy Product Actualizer process source) as a competing canonical store.
      expected: >-
        Boundary check rejects the competing model/authority store with a bounded
        diagnostic.
    - id: NE-04
      attack: Add a second `.sea` authority outside the canonical semantic source.
      expected: Boundary check rejects the duplicate semantic authority.
    - id: NE-05
      attack: Point the semantic adapter at a false world_ref or delete the canonical model.
      expected: The adapter fails closed and no successful structural result is emitted.

  known_confounds:
    - Structural E2E proves wiring and provenance, not business behavior or live settlement.
    - SEA-Forge, Gauntlet, RealityTrace, Context Kernel and Product Actualizer integrations remain typed seams, not live integrations.
    - The pinned Cognate CLI requires `--source` at 0.6.1 even though plan prose says optional; the exact command is recorded.
    - Product Actualizer reuse is structural/surface vocabulary only; its Product Model and router are not imported as runtime authority.
    - Not all future task gates are implemented at T04; unimplemented gates fail closed rather than returning green.

  evidence_plan:
    - .agents/evidence/horizon/T04/scaffold.log
    - .agents/evidence/horizon/T04/just-check.log
    - .agents/evidence/horizon/T04/just-boundaries.log
    - .agents/evidence/horizon/T04/just-test.log
    - .agents/evidence/horizon/T04/just-verify.log
    - .agents/evidence/horizon/T04/ledger-validation.log
    - .agents/evidence/horizon/T04/wayfinder-validation.log
    - .agents/evidence/horizon/T04/teeth-missing-cognate.log
    - .agents/evidence/horizon/T04/teeth-in-memory-runtime.log
    - .agents/evidence/horizon/T04/teeth-product-model.log
    - .agents/evidence/horizon/T04/teeth-duplicate-sea.log
    - .agents/evidence/horizon/T04/teeth-false-world.log
    - .agents/evidence/horizon/T04/SUMMARY.md

  redesign_trigger: >-
    The pinned Cognate starter cannot represent the required semantics without a framework
    change, or the scaffold donor requires importing a second authoritative system.

  confirmation_condition: >-
    Builder demonstrates every preregistered positive and negative check with retained
    exact commands and output, records independent critic verdicts before freezing, and
    documents exact release API mismatches and remaining unknowns.
