      the capability interface and implements it as Cognate capabilities registered by
      the Horizon application, plus upstream requests to Cognate. RealityTrace uses the
      existing @godspeedai/cognate-realitytrace adapter. No direct product linkage.
    rationale:
      - "REQ-STACK-010 permits Cognate capabilities or Cognate-owned adapters; the interface stays Cognate-mediated."
      - "DEBT D-005 records the missing adapters."
    reversible: true
    evidence: ["cognate packages/ (no gauntlet/context-kernel adapter)", "cognate packages/realitytrace/src/sxr-cli.ts"]

