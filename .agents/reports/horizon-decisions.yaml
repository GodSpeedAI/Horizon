  - id: DEC-T00-01
    date: "2026-10-19"
    task: T00
    requirement: REQ-DEV-003
    decision: >-
      The single authoritative implementation of developmental settlement scoring and
      capability-promotion rules is the Python research subsystem (the carried-over
      godspeed_nav semantics), invoked by Horizon through a typed, versioned Cognate
      process contract. Horizon (T17) consumes its verdicts for developmental
      interpretation and MUST NOT re-score in TypeScript. godspeed_agent's golden
      fixtures and tests are the conformance oracle; inherited thresholds migrate as
      provenance-bearing configuration, never silently changed.
    rationale:
      - "REQ-RES-001 forbids reimplementing ML training/evaluation in TypeScript."
      - "Plan DAG edge T21 -> T17; REQ-DEV-003 settles at T17 and depends on the T21 subsystem."
      - "One home per fact: a TS port alongside the Python capability would be two authoritative scorers."
    reversible: false
    evidence: [".agents/reports/horizon-research-migration-manifest.yaml", ".agents/specs/horizon.agent.spec.yaml#requirements"]

