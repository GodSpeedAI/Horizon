      - ".agents/DEBT.md#D-011"

  - id: DEC-T04-03
    date: "2026-10-19"
    task: T04
    requirement: REQ-VERIFY-002
    decision: >-
      T04-CR-001 is PREPARED, not applied. The independent verdict (codex-root-20261019-7b4d110)
      found four material defects in frozen artifacts: the frozen ledger and Wayfinder invert
      four prohibitions (F2, S1); three contracts are underdetermined (F3, S2); and the prereg's
      pin_revision.verified_by cites "0 violations" as verification (F4, S2). The exact proposed
      changes, witnesses, affected hashes and the re-freeze process are recorded in
      .agents/candidates/horizon/T04-CR-001/ (CANDIDATE.yaml, REVIEW.md, composed/prereg.patch).
      The active frozen spec, preregistration, ledger, Wayfinder and canonical world are unchanged.
      Applying it requires the owner's explicit authorization (a new freeze id and fresh,
      context-isolated independent criticism of the candidate inputs).
    rationale:
      - "Changing only the generator would fix future ledgers and leave the frozen oracles wrong; the verdict says so explicitly."
      - "The generator fix is landed now because it is mutable code, and a self-test plus check-acceptance-claims.py prevents recurrence."
      - "The ruler is not edited: no requirement is added, removed or reworded, and world_ref is unchanged, so no plan rebind is needed."
    reversible: true
    evidence:
      - ".agents/candidates/horizon/T04-CR-001/CANDIDATE.yaml"
      - ".agents/candidates/horizon/T04-CR-001/REVIEW.md"
      - ".agents/evidence/horizon/T04/verdicts/codex-root-20261019-7b4d110.md"
      - ".agents/evidence/horizon/T04/REMEDIATION.md"

  - id: DEC-T04-04
    date: "2026-10-19"
    task: T04
    requirement: REQ-VERIFY-002
    decision: >-
      T04-CR-001 is revised to revision 2 and remains PREPARED, NOT APPLIED. The owner deferred
      the authorization decision and directed that fresh independent criticism of the candidate
      proceed first. That criticism (criticism round 1, a build-session record, not an independent
      verdict) found four defects in the first draft: a materiality predicate with its own list of
      outcomes in AC-CASE-002-01, a prescribed "exercise through construction" reading plus a claim
      about provider records that nothing observed in AC-CONFIG-004-01, an unratified "pinned frame
      vocabulary" in AC-NAV-005-01, and -- found by reviewing every regenerated contract -- the same
      prohibition-inversion class recurring in REQ-STACK-002. A second pass added REQ-RES-004,
      REQ-STACK-013, REQ-WORLD-008 and REQ-NAV-003/STACK-009 (MAY restated as an absolute) and
      REQ-UX-009 (SHOULD restated as a MUST). All are corrected: the three named contracts now restate
      their requirement verbatim with the witness input stated separately, the witnesses were
      rewritten to the spec's own algorithm or to configuration the application actually reads, and
      the generator preserves MAY and SHOULD and treats a lowercase "not" as a prohibition.
    rationale:
      - "The owner's instruction: preserve MUST, MUST NOT, MAY and SHOULD exactly in meaning; a witness may supply an input but may not restate policy as though ratified."
      - "Ratification is never automatic: no contract carries a 'potentially-ratified' hold, because that would read as a proposed spec amendment while the ruler is frozen at 1.0.0."
      - "The active frozen artifacts are untouched (six pins byte-identical), so no inverted prohibition is recorded as accepted risk and T04 is not settled."
    reversible: true
    evidence:
      - ".agents/evidence/horizon/T04/criticism-round1.md"
      - ".agents/candidates/horizon/T04-CR-001/CANDIDATE.yaml"
      - ".agents/candidates/horizon/T04-CR-001/REVIEW.md"
      - "scripts/check-witness-claims.py"
      - "scripts/measure-contract-modals.py"
      - ".agents/DEBT.md"

  - id: DEC-T04-05
    date: "2026-10-19"
    task: T04
    requirement: REQ-VERIFY-002
    decision: >-
      T04-CR-001 revision 2 is AUTHORIZED, conditional on fresh independent review of the
      candidate; NOT YET APPLIED. The owner authorized the full candidate (not only the prereg
      patch) on the condition that a context-isolated reviewer first reviews candidate revision 2,
      criticism round 1, the DEBT D-020 baseline and review question 9 (REQ-UX-009). Nothing is
      applied, regenerated or re-frozen until a verdict exists in
      .agents/evidence/horizon/T04/verdicts/. The single review entry point is
      .agents/evidence/horizon/T04/REVIEW_REQUEST.md; the two earlier requests are superseded and
      retained as REVIEW-attempt1.superseded.md and REMEDIATION.review-request.superseded.md.
    rationale:
      - "The owner's instruction: authorize full, conditional on a fresh independent review of the candidate first."
      - "Conditional, not effective: the authorization carries no effect on any frozen artifact until the condition is met, so the record cannot be read as an approved freeze."
      - "Disposition on the verdict: no S1/S2 -> apply, regenerate, run freeze-formation.sh, record the new freeze id and hashes, append status; NAV-002 / RES-001 / STACK-011 / STACK-014 judged a defect -> fold into revision 3 BEFORE freezing, because a known-wrong contract must not be frozen; anything else material -> revise and resubmit. No finding is waived."
      - "Scope is fixed: no spec edits, no world_ref change (the REQ-CMP-001 .sea correction stays deferred under D-016), no T05 work."
    reversible: true
    conditions:
      - "A verdict exists at .agents/evidence/horizon/T04/verdicts/<reviewer-id>.md, written by a reviewer independent of the builder."
      - "The reviewer completed rulings R1-R4 of REVIEW_REQUEST.md section 3."
    evidence:
