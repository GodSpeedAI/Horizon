  - id: DEC-T00-03
    date: "2026-10-19"
    task: T00
    requirement: REQ-STACK-011
    decision: >-
      Sea-rs (GodSpeedAI/SEA-Forge) is the sole authoritative SEA-Forge for Horizon. The
      SEA / NewSea / XSEA / sentient-enterprise-architecture checkouts own no live
      behavior Horizon consumes and are excluded from integration; they are not in the
      spec's authoritative repository map.
    rationale:
      - "Spec sources.existing_implementation.repositories lists only GodSpeedAI/SEA-Forge at ~/projects/sea-rs."
      - "~/projects/SEA is GodSpeedAI/SEA (dev, 2026-07-04, MPL-2.0 0.19.1); NewSea has no remote and a detached HEAD; XSEA has no remote; sentient-enterprise-architecture is GodSpeedAI/SEA main at 2025-10-06."
    reversible: true
    evidence: [".agents/reports/horizon-product-integration-register.yaml#unresolved_sea_family_resolved"]

  - id: DEC-T00-04
    date: "2026-10-19"
    task: T00
    requirement: REQ-STACK-010
    decision: >-
      Because Cognate ships no adapters for Gauntlet or Context Kernel, Horizon defines
      the capability interface and implements it as Cognate capabilities registered by
      the Horizon application, plus upstream requests to Cognate. RealityTrace uses the
      existing @godspeedai/cognate-realitytrace adapter. No direct product linkage.
    rationale:
      - "REQ-STACK-010 permits Cognate capabilities or Cognate-owned adapters; the interface stays Cognate-mediated."
      - "DEBT D-005 records the missing adapters."
    reversible: true
    evidence: ["cognate packages/ (no gauntlet/context-kernel adapter)", "cognate packages/realitytrace/src/sxr-cli.ts"]

  - id: DEC-T00-05
    date: "2026-10-19"
    task: T00
    requirement: REQ-STACK-001
    decision: >-
      Pin @godspeedai/cognate-* 0.6.1 (origin/main a477933) and @godspeedai/domainforge
      0.21.1. Treat the PATH `domainforge` CLI (0.19.0) as stale and do not use it for
      .sea validation. At T04, scaffold with `cognate create <dir> --profile ... --source
      <checkout>`; the '--source optional' behavior exists only in commit 61015df, which
      is not on main at a477933.
    rationale:
      - "Cognate main binds @godspeedai/domainforge 0.21.1; local CLI reports 0.19.0."
      - "packages/cli/src/bin.ts at a477933 exits when --source is absent."
    reversible: true
    evidence: [".agents/OPEN_QUESTIONS.md#OQ-01", "cognate packages/cli/src/bin.ts:31-34"]

  - id: DEC-T01-01
    date: "2026-10-19"
    task: T01
    requirement: REQ-STACK-001
    decision: >-
      Author the canonical IDM against DomainForge 0.21.1's Application Contract
      (typed entities, record/enum/operation), not the stale 0.17-era skill cheatsheet.
      Pin the locally built `~/projects/domainforge/target/release/domainforge` (0.21.1)
      and compose `world_ref` only from DomainForge's `semantic_closure_hash`. Use
      relative-path imports. Model SIX journeys J01-J06 because the frozen spec declares
      six and the spec is the ruler.
    rationale:
      - "REQ-STACK-001: DomainForge alone owns semantic compilation and world_ref identity."
      - "domainforge-core/grammar/sea.pest and docs/reference/sea-application-contract.md are the current syntax authority."
      - "Plan T01 prose says five journeys; the frozen spec says six (OQ-06)."
    reversible: true
    evidence:
      - ".agents/skills/domainforge-sea/references/sea-dsl-ai-cheatsheet.yaml:4"
      - "domainforge docs/reference/sea-application-contract.md"
      - ".agents/evidence/horizon/T01/gate-01-validate-application.log"

  - id: DEC-T01-02
    date: "2026-10-19"
    task: T01
    requirement: REQ-NAV-006
    decision: >-
      Record the authority gate binding as inert (`as: true`) policies plus typed
      invariants and OpenSemanticQuestion instances, because Horizon does not own
      authorization; SEA-Forge does. Do not fabricate enforceable authority semantics
      in the IDM.
    rationale:
      - "AGENTS.md §9: Horizon MUST NOT become SEA-Forge policy authority."
      - "The concrete payment model, authority preview and Gauntlet threshold remain unknown (OQ-IDM-01..04)."
    reversible: true
    evidence: [".sea/interaction/validation/limitations.md", ".sea/interaction/assumptions-and-unknowns.md"]


  - id: DEC-T02-01
    date: "2026-10-19"
    task: T02
    requirement: REQ-INT-001
    decision: >-
      Prove the six journeys with a fixture-backed sequential engine (PROVE mode) that
      evaluates IS1-IS8 one decision at a time. A `settled` result is a fixture outcome
      only; bindings to Cognate, SEA-Forge, Gauntlet and RealityTrace are recorded as
      inferred, not exercised. Generated transcripts are evidence artifacts, not live
      integration proof.
    rationale:
      - "P1B requires executable sequential behavior before projections or UI, not a second semantic authority."
      - "Live authority, execution and evidence integrations are later tasks; claiming them here would fabricate evidence."
      - "Unknown, conflicted, cancelled and executed-but-unsettled outcomes must remain visible rather than collapse into success/failure."
    reversible: true
    evidence:
      - "behavioral/proof/engine.py"
      - "behavioral/proof/scenarios.yaml"
      - ".agents/evidence/horizon/T02/scenario-matrix.log"

  - id: DEC-T03-01
    date: "2026-10-19"
    task: T03
    requirement: REQ-UI-005
    decision: >-
      Keep compact one-question-at-a-time prompts as the default projection, and earn
      persistent regions only for context, evidence/settlement inspection, history and
      comparison. Reject a dashboard and any UI approval control: metrics without a
      behavioral trace are untraceable, and approval is a SEA-Forge relationship.
    rationale:
      - "Behavioral proof shows one-decision-at-a-time navigation for most steps."
      - "Evidence and settlement need simultaneous visibility with actions; a dashboard does not reduce a proven burden."
      - "A UI approval control would duplicate authority and violate the boundary that possibility is not affordance."
    reversible: true
    evidence:
      - "ui-model/projection-decisions.yaml"
      - "ui-model/traceability.yaml"
      - ".agents/evidence/horizon/T03/teeth-ui-traceability.log"
