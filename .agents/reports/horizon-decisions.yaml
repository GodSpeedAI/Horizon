  - id: DEC-T02-01
    date: "2026-10-19"
    task: T02
    requirement: REQ-INT-001
    decision: >-
      Prove the six journeys with a fixture-backed sequential engine (PROVE mode) that
      evaluates IS1-IS8 one decision at a time. A `settled` result is a fixture outcome
      only; bindings to Cognate, SEA-Forge, Gauntlet and RealityTrace are recorded as
      inferred, not exercised. Generated transcripts are evidence artifacts, not live
      integration proof.
    rationale:
      - "P1B requires executable sequential behavior before projections or UI, not a second semantic authority."
      - "Live authority, execution and evidence integrations are later tasks; claiming them here would fabricate evidence."
      - "Unknown, conflicted, cancelled and executed-but-unsettled outcomes must remain visible rather than collapse into success/failure."
    reversible: true
    evidence:
      - "behavioral/proof/engine.py"
      - "behavioral/proof/scenarios.yaml"
      - ".agents/evidence/horizon/T02/scenario-matrix.log"

  - id: DEC-T03-01
    date: "2026-10-19"
    task: T03
    requirement: REQ-UI-005
    decision: >-
      Keep compact one-question-at-a-time prompts as the default projection, and earn
      persistent regions only for context, evidence/settlement inspection, history and
      comparison. Reject a dashboard and any UI approval control: metrics without a
      behavioral trace are untraceable, and approval is a SEA-Forge relationship.
    rationale:
      - "Behavioral proof shows one-decision-at-a-time navigation for most steps."
      - "Evidence and settlement need simultaneous visibility with actions; a dashboard does not reduce a proven burden."
      - "A UI approval control would duplicate authority and violate the boundary that possibility is not affordance."
    reversible: true
    evidence:
      - "ui-model/projection-decisions.yaml"
      - "ui-model/traceability.yaml"
      - ".agents/evidence/horizon/T03/teeth-ui-traceability.log"

  - id: DEC-T04-01
    date: "2026-10-19"
    task: T04
    requirement: REQ-DEV-003
    decision: >-
      PE-01's ordering condition (independent criticism verdicts recorded BEFORE the
      ledger/Wayfinder freeze) was not met as written. The owner ruled on 2026-10-19 that
      post-freeze criticism stands in for it: PE-01 is NOT restated, the T04
      preregistration is NOT edited, and the deviation is recorded here instead. T04
      settles only after the verdicts are recorded under
      .agents/evidence/horizon/T04/verdicts/ AND any material finding is resolved; a
      material finding in a frozen artifact becomes a candidate revision and a re-freeze,
      and is never waived.
    rationale:
      - "Owner decision 2026-10-19 (explicit): accept post-freeze criticism; do not restate PE-01, do not edit the T04 preregistration."
      - "The miss was procedural, not epistemic: the builder ran out of affordable independent capacity, and the freeze was executed by the builder while PE-01 was already known to be unmet. It was recorded as unmet in CURRENT_STATUS revision 8 rather than claimed as met."
      - "Retroactively inserting pre-freeze verdicts is impossible; fabricating them would be self-attestation. Late criticism is the only honest repair that preserves the frozen artifacts."
      - "Late review is weaker than the preregistered order: the reviewer sees the freeze has already happened. That weakness is recorded, not argued away."
    reversible: false
    evidence:
      - ".agents/prereg/horizon/T04.prereg.yaml#L43-L48"
      - ".agents/evidence/horizon/T04/REVIEW_REQUEST.md"
      - ".agents/CURRENT_STATUS.jsonl#rev8"

