      - ".agents/evidence/horizon/T04/REVIEW-attempt1.superseded.md"
      - ".agents/evidence/horizon/T04/REMEDIATION.review-request.superseded.md"
      - ".agents/candidates/horizon/T04-CR-001/CANDIDATE.yaml"
      - ".agents/candidates/horizon/T04-CR-001/REVIEW.md"
      - ".agents/DEBT.md"

