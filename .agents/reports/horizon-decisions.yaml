    rationale:
      - "Observed directly: REQ-INT-003 -> REQ-DOES-NOT-EXIST-999 still reports 0 violations, exit 0."
      - "Observed directly: INV-08 relabelled INV-07 (duplicate id) still reports 0 violations, exit 0."
      - "The T04 pin revision was itself caused by a wrong requirement_ref, so the gate cited for that fix cannot see that class of defect."
    reversible: true
    evidence:
