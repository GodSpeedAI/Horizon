  - id: DEC-T05-08
    date: "2026-10-20"
    task: T05
    requirement: none (corrects the T05 NE→test map and restores PE-05)
    decision: >-
      The owner asked "is T05 settled?" and the audit answered no. Three defects, all of claim rather
      than of property: (1) the test named NE-02 asserted provenance laundering, not the preregistered
      iframe/jsx/onclick attack; (2) NE-03 had no test at all and NE-04/NE-05 were labelled onto
      different tests; (3) PE-05 could not be satisfied as written because projectSurface dropped
      agent_ref/on_behalf_of_ref/principal_ref, so no view could render an agent as acting for a
      human. Fixed inside T05's own authority: the prereg-literal attacks are now asserted, NE-03
      and NE-10 have their own tests, the projection carries the delegation and both renderers print
      it, and scripts/check-t05-prereg-coverage.ts fails if any prereg id stops being named by a test
      that names that id's attack. T05 remains SETTLED on that basis; the substantive properties
      were never in question — gate-t05 and verify were and are green, and no live vulnerability was
      found. What changed is that the evidence now demonstrates what it claims.
    reversible: true
    evidence:
      - "test/surface-negative.test.ts"
      - "scripts/check-t05-prereg-coverage.ts"
      - "scripts/teeth-t05-prereg-coverage.ts"
      - "src/ui/surface2/project.ts"
      - "src/ui/surface2/render.ts"
      - ".agents/evidence/horizon/T05/SUMMARY.md"
      - "justfile"

  - id: DEC-T05-09
    date: "2026-10-20"
    task: T05
    requirement: REQ-SAFE-003
    decision: >-
      The frozen T05 preregistration has a YAML structural defect: PE-06, PE-07 and PE-08 are not
      members of `positive_expectations`. Their `- id:` / `expectation:` lines were indented inside
      the folded `>-` scalar `confirmation_condition` and were absorbed as text, so a YAML parser
      sees five positive expectations where the author registered eight. The frozen artifact is
      NOT edited. The defect is recorded, and the prediction is made machine-readable through a
      separately versioned interpretation at `.agents/prereg/horizon/T05.prereg.interpretation.yaml`
      which quotes the frozen sha256 and restates PE-06/07/08 verbatim with `member: false`.
    rationale:
      - "Owner direction (2026-10-20): do not modify the frozen file; preserve the original artifact; record the structural defect; provide a separately versioned interpretation authorized at the appropriate level."
      - "The coverage check now parses with Bun.YAML and must either find each id as a registered member, recover it from the hash-pinned interpretation, or fail. It no longer counts scalar text as registration. The three cases are reported differently on purpose: 'registered', 'recovered', and 'absent' are not the same claim."
      - "Both readings before this decision were wrong in the builder's favour: a regex line scanner counted all eight; a strict parser would have seen five and silently dropped three predictions."
    reversible: true
    evidence:
      - ".agents/prereg/horizon/T05.prereg.yaml (frozen, unedited; sha256 ff36d65b…3019)"
      - ".agents/prereg/horizon/T05.prereg.interpretation.yaml"
      - ".agents/evidence/horizon/T05/finding-prereg-structure.log"
      - "scripts/check-t05-prereg-coverage.ts"
      - "scripts/teeth-t05-prereg-coverage.ts (NE-C6, NE-C7, NE-C8)"

  - id: DEC-T05-10
    date: "2026-10-20"
    task: T05
    requirement: REQ-WORLD-001
    decision: >-
      T06 will be built as a Horizon-owned typed operational object projection on Cognate's public
      `Projection` API. Horizon does not fork, patch or re-implement Cognate to obtain generic
      object querying. `DurableStore` already provides the read primitives this needs —
      `readProjectionSnapshot(name)` (checkpoint and rows from one statement, so the checkpoint can
      never be ahead of the rows), `listProjection(name)` (all state, ordered by key) and
      `getProjection(name)` — and `ProjectionRunner` supplies `catchUp` / `retry` / `rebuild` with
      `rebuild_required` on a version change. Semantic identity comes from DomainForge, operational
      state from Cognate, and the semantic, operational and lineage graphs stay distinct.
    rationale:
      - "D-002 is settled: the gap is generic typed querying (filters beyond top-level equality, relationship traversal), not durable state. CLAIM-005 in the frozen spec states the same and names REQ-WORLD-006's required evidence."
      - "Verified against the pinned 0.6.1 sources, not against skill prose: `.agents/evidence/horizon/T06/pinned-api-inspection.log`."
      - "The genuine deficiencies to report upstream are: no non-equality or scoped predicate query, no traversal, and no projection-version-aware query API. Those are framework gaps, not reasons for a shadow framework."
      - "Cost accepted: Horizon reads whole projections and filters in-process. That is bounded by projection size, so traversal must be bounded by depth and result count, and a large-world scale claim is out of scope for T06."
    reversible: true
    evidence:
      - ".agents/evidence/horizon/T06/pinned-api-inspection.log"
      - "node_modules/@godspeedai/cognate-projections/src/types.ts"
      - "node_modules/@godspeedai/cognate-events/src/types.ts:176-235"
      - ".agents/DEBT.md D-002"



  - id: DEC-T06-01
    date: "2026-10-20"
    task: T06
    requirement: REQ-WORLD-006
    decision: >-
      The operational object layer is a projection, not a store, and the outcome set is closed at
      five values. Objects, links and lineage are folded from durable Cognate events by
      `horizon.operational-objects` (via the public `Projection` interface) and read back through
      `readProjectionSnapshot`, so checkpoint and rows come from one statement. Horizon adds no
      mutable object database of its own.
    rationale:
      - "REQ-WORLD-006 requires typed Cognate projections keyed by DomainForge semantic IDs with no separate mutable object store; DEC-T05-10 chose the mechanism, this fixes the read model."
      - "The composite checkpoint is commit position plus projection name and version, because a position alone cannot reproduce a result after a version bump."
      - "`empty`, `no-match`, `denied`, `blocked` and `unavailable` are five facts. Collapsing any two is a false claim, and NE-01/NE-02 and the M1/M2 mutants exist to keep them apart."
      - "A projection with no checkpoint is `empty`, not `unavailable`: Cognate's runner commits no checkpoint when it folded no events, so requiring one reported a healthy empty store as a source failure (found by PE-07)."
      - "Reads filter in process because the pinned store offers no predicate query. Cost scales with projection size; no scale claim is made and no index was invented."
    reversible: true
    evidence:
      - "src/domain/operational.ts"
      - "src/projections/operational-objects.ts"
      - "src/adapters/operational-objects.ts"
      - ".agents/evidence/horizon/T06/SUMMARY.md"
      - ".agents/evidence/horizon/T06/pinned-api-inspection.log"

  - id: DEC-T06-02
    date: "2026-10-20"
    task: T06
    requirement: REQ-WORLD-005
    decision: >-
      The semantic import graph, the operational relation graph and lineage are three structures
      with distinct identities and distinct edge kinds. A link declares `graph: operational`;
      lineage is a separate record type keyed by observation; the operational relation vocabulary
      (`journey.covers`, `entity.governed_by`, `host.serves`, `entity.lineage_of`) is declared by
      Horizon and is NOT derived from the world's semantic `relation` declarations.
    rationale:
      - "REQ-WORLD-005 requires distinct identities and semantics; reusing `flow.from` as an operational link would make one name mean two things."
      - "The recorder refuses an unknown relation type, a non-operational graph marker and a dangling endpoint *before* commit, so a half-link can never exist for a traversal to discover."
      - "Traversal searches only the operational index, so lineage and import edges are unreachable by construction rather than by a filter that could be forgotten."
    reversible: true
    evidence:
      - "src/projections/operational-objects.ts"
      - "test/support/operational-fixture.ts"
      - "test/operational-objects-negative.test.ts (NE-06)"

  - id: DEC-T06-03
    date: "2026-10-20"
    task: T06
    requirement: REQ-WORLD-002
    decision: >-
      Traversal is breadth-first over the operational link index, requires explicit `max_depth`
      and `max_objects`, and is refused before any work when either is absent. It is not a general
      graph query and does not attempt to be: the pinned store provides no traversal, and building
      one would be a second query engine (which DEC-T05-10 rules out).
    rationale:
      - "An unbounded traversal over a cyclic relationship does not terminate by choice, so the bound is a precondition rather than an option."
      - "An exceeded bound is refused rather than truncated, because a truncated answer looks like a complete one."
      - "Edge buckets and frontiers are sorted by relation type then target ref, so the visit order is a function of the graph and not of insertion order."
      - "Durable fixture evidence only. A large-world traversal would need an index or an upstream API; that is recorded as an upstream ask (D-002), not worked around locally."
    reversible: true
    evidence:
      - "src/adapters/operational-objects.ts (traverse)"
      - "test/operational-objects.test.ts (PE-06)"
      - "test/operational-objects-negative.test.ts (NE-03)"


  - id: DEC-T07-01
    date: "2026-10-20"
    task: T07
    requirement: REQ-NAV-006
    decision: >-
      The T07 controller is pure and source-agnostic. It reads no clock, store or network; authority
      arrives as a typed evaluation record, and the frame declares `grants_authority: false`. T07
      has no SEA-Forge channel, so the controller proves gate semantics, not live authorization.
      A caller cannot turn a gate value into permission: likely_allow is non-granting and the
      commit path remains a separate typed intent.
    rationale:
      - "REQ-NAV-006 makes every authority value non-granting; a controller that called SEA-Forge would also be a second authorization path."
      - "REQ-OUT-002 forbids UI enablement from becoming authority; purity is what makes that checkable."
      - "The T02 behavioral proof already fixes the same vocabulary; reusing it avoids a second semantics."
    reversible: true
    evidence:
      - "src/domain/navigation.ts (assessAffordance, buildNavigationFrame)"
      - "test/navigation-controller.test.ts (PE-06, PE-12)"
      - "test/navigation-negative.test.ts (NE-04, NE-05, NE-09)"

  - id: DEC-T07-02
    date: "2026-10-20"
    task: T07
    requirement: REQ-NAV-002
    decision: >-
      Gate outcomes map as follows. likely_allow and deferred_to_invocation pass; requires_approval
      is blocked with an approval prerequisite; denied blocks; unreachable and unknown block as
      unknown. A non-pass gate must carry a material reason. Recovery unknown blocks only an
      irreversible or unknown-reversibility move, matching the IDM's stated unknown behavior.
      Scalar pass/fail aliases are not accepted: the gate map has exactly the seven canonical keys
      and every entry is a structured assessment.
    rationale:
      - "The T02 engine already distinguishes pass, pending, blocked and unknown authority; using different names here would be a second vocabulary."
      - "A bare boolean would hide the reason and prerequisite REQ-NAV-003 requires."
      - "Recovery is the one gate whose unknown behavior is conditional in the canonical IDM."
    reversible: true
    evidence:
      - "src/domain/navigation.ts (assertGates, assessAffordance)"
      - "behavioral/proof/engine.py (AUTHORITY_PASS/PENDING/BLOCK)"
      - ".sea/interaction/interaction-model.sea (gate_recovery)"

  - id: DEC-T07-03
    date: "2026-10-20"
    task: T07
    requirement: REQ-CASE-001
    decision: >-
      A Case is a derived value over authoritative fact references and a declared direction. It is
      never stored, and unknown keys are refused, so it cannot grow into an entity/class ontology.
      The source adapter reads the T06 projection and derives only read-only inspection moves; it
      does not invent a consequential move, authority evaluation or payment estimate. An absent
      focus is reported as a material operational deviation with no fabricated repair.
    rationale:
      - "REQ-CASE-001 forbids a competing ontology; a typed derived value has no place to keep one."
      - "T07 has no live authority source, so a consequential candidate would have to invent its gates."
      - "The focus-missing fact is an observation at a checkpoint, not a prediction of what should happen."
    reversible: true
    evidence:
      - "src/domain/navigation.ts (deriveCase)"
      - "src/adapters/navigation.ts (deriveOperationalNavigation)"
      - "test/navigation-source.test.ts"

  - id: DEC-T07-04
    date: "2026-10-20"
    task: T07
    requirement: REQ-OUT-001
    decision: >-
      T07 adds `horizon.navigation/2` as an additive frame and leaves T04/T05's
      `horizon.navigation-frame/1` untouched. The structural frame continues to serve the existing
      surface seam; the navigation frame carries the fuller affordance, case and settlement facts.
      Merging them now would force a T05 surface revision with no requirement demanding it.
    rationale:
      - "T05's surface contract is frozen and settled; an additive type avoids re-opening it."
      - "REQ-OUT-001 needs fields the structural frame does not carry (gate assessments, case, settlement)."
      - "The controller can later feed the surface seam without either side owning the other."
    reversible: true
    evidence:
      - "src/domain/navigation.ts (NAVIGATION_SCHEMA)"
      - "src/domain/frame.ts (unchanged v1)"
      - "just gate-t05"

  - id: DEC-T08-01
    date: "2026-10-20"
    task: T08
    requirement: REQ-UI-004
    decision: >-
      The sequential controller is a pure, renderer-neutral state machine between the
      `horizon.navigation/2` frame and a `horizon.sequential-intent/1` intent. The OpenTUI
      component only maps prompt options to `Select`/`Confirm`; it cannot widen availability,
      invent a gate, approve an escalation or execute a capability.
    rationale:
      - "REQ-UI-004 and REQ-GOAL-003 require the terminal and GUI to consume one behavioral contract, not two policy implementations."
      - "A pure controller can be tested without a terminal, while the real renderer is tested through OpenTUI's key events."
      - "Keeping execution in the capability path preserves REQ-STACK-003 and REQ-NAV-006."
    reversible: true
    evidence:
      - "src/ui/sequential/controller.ts"
      - "src/ui/sequential/terminal.tsx"
      - "test/sequential-controller.test.ts"
      - "test/sequential-terminal.test.tsx"

  - id: DEC-T08-02
    date: "2026-10-20"
    task: T08
    requirement: REQ-INT-002
    decision: >-
      One prompt is the whole decision surface. Blocked, unknown and conflicted choices stay
      visible but disabled with a plain-language reason and the single next prerequisite; a
      consequential available move passes a review step before its confirm intent exists.
      Observer controls remain selectable so the observer can inspect, defer, reframe or disagree.
    rationale:
      - "REQ-INT-002 asks Clack to present one next meaningful decision at a time."
      - "Hiding blocked alternatives would make the representation look complete when it is not."
      - "REQ-NAV-007 and REQ-UX-005 require reversibility, payment, evidence, escalation and the next prerequisite before commitment."
    reversible: true
    evidence:
      - "src/ui/sequential/controller.ts (promptFor, reviewFor)"
      - "test/sequential-controller.test.ts"
      - "test/sequential-terminal.test.tsx"

  - id: DEC-T08-03
    date: "2026-10-20"
    task: T08
    requirement: REQ-OUT-002
    decision: >-
      T08 ends at a typed intent. It does not submit the intent to Cognate, call SEA-Forge or claim
      an effect. The `simulated` flag is part of the intent, and the review prompt labels simulation
      in plain language when the caller selected it.
    rationale:
      - "T08's proof level is P1 and its plan explicitly does not prove live authority or settlement."
      - "Recording a choice is not approval, execution or a world mutation (REQ-INT-004)."
      - "T10/T11 own the governed execution path; anticipating it here would invent authority."
    reversible: true
    evidence:
      - "src/ui/sequential/controller.ts (SequentialIntent)"
      - "test/sequential-controller.test.ts (simulation)"
      - ".agents/evidence/horizon/T08/SUMMARY.md"

  - id: DEC-T08-04
    date: "2026-10-20"
    task: T08
    requirement: REQ-NAV-005
    decision: >-
      Context that the frame already carries is displayed, never asked for again. An unknown
      checkpoint is the only context question the controller can raise. `horizon frame` defaults
      its focus to the first projected object by ref and reports a synthetic absent focus as a
      material deviation rather than inventing a repair.
    rationale:
      - "REQ-NAV-005 forbids asking for context the controller can resolve without user burden."
      - "A deterministic default keeps scripts and tests from depending on random ordering."
      - "An absent focus is an observation about the projection, not a reason to fabricate a move."
    reversible: true
    evidence:
      - "src/ui/sequential/controller.ts (contextOf)"
      - "src/app.ts (navigationFrame)"
      - "test/sequential-controller.test.ts"
      - "test/sequential-cli.test.ts"

  - id: DEC-T08-05
    date: "2026-10-20"
    task: T08
    requirement: REQ-UI-004
    decision: >-
      The Clack shell, `Select` and `Confirm` are a source copy of GodSpeedAI/Terminal-UI at commit
      7932155 under MIT, placed under `src/ui/sequential/vendor/terminal-ui/`. Horizon owns the copy;
      the upstream Workbench, scenarios and other controls are not included. Attribution and license
      text are recorded in THIRD_PARTY_NOTICES.md.
    rationale:
      - "The T08 plan names the terminal-ui registry copy as the intended donor path."
      - "A source copy avoids a runtime dependency on a private sibling checkout and keeps the UI editable."
      - "MIT permits redistribution with attribution; the license text is retained."
    reversible: true
    evidence:
