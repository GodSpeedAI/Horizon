open_questions:

  - id: OQ-001
    raised: "2026-10-19"
    task: T04
    target_spec_version: next (after 1.0.0; NOT amended now)
    requirement: REQ-UX-009
    question: >-
      REQ-UX-009 states a SHOULD ("read-only navigation interactions SHOULD respond within 300 ms
      p95 on the local_operator profile"). The candidate renders it as "should be observed to
      respond". Is a soft obligation faithfully expressed by an observation of soft obligation, or
      does REQ-UX-009 need a different contract shape entirely for the next spec version?
    position: >-
      KEPT AS IS for the T04 freeze, by owner decision. This is not an accepted defect and not a
      waiver of the modal: the SHOULD is preserved as a SHOULD and the review request still asks the
      independent reviewer to rule on whether the shape is faithful (R4). Changing the shape is a
      next-spec-version question, because a T04 re-freeze cannot legitimate a change in meaning.
    status: open
    rationale:
      - "The owner's instruction: keep 'should be observed to respond'; log an open question for the next spec version; do not amend the spec now."
      - "Editing the ruler requires a new spec version, an explicit re-freeze and a plan rebind; a T04 re-freeze cannot legitimate a semantic change."
    evidence:
      - ".agents/candidates/horizon/T04-CR-001/REVIEW.md"
      - ".agents/evidence/horizon/T04/REVIEW_REQUEST.md"
