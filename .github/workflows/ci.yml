name: CI

# Runs Horizon's existing gates unchanged: `just verify` (as `verify-static` plus the bun suite in shards), the desk build and
# the typecheck. External binaries are fetched from their GitHub Releases and verified against the release SHA256SUMS
# (fail closed); nothing is built from source and no Docker is used. Downloads (verified binaries, Chromium) are cached.
#
# The `verify (just verify, build:desk, typecheck)` job is the aggregate: it passes only when every part passed (or the change
# is documentation-only). Nothing is skipped by a path filter, so a check is never missing from a pull request; a
# documentation-only change short-circuits inside the jobs instead.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # No packageManager/.bun-version in the repo; the lockfile and gates were produced with this Bun.
  BUN_VERSION: "1.4.0"
  DOMAINFORGE_VERSION: "0.22.0"
  REALITYTRACE_VERSION: "0.5.0"
  TEST_SHARDS: 4

jobs:
  changes:
    name: changes
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - name: Classify the change
        id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          docs_only=false
          if [ "$EVENT" = "pull_request" ]; then
            files=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate -q '.[] | .filename, (.previous_filename // empty)')
            # Documentation-only: every touched path is a report or note under .agents/reports/ (nothing in the gates reads them).
            # docs/ is NOT in this list: the boundary checks read docs/donors.md and the tests quote docs/IGNITION.md.
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -v -E '^\.agents/reports/.*\.(md|png)$' | grep -q .; then
              docs_only=true
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only"

  static:
    name: static (check, boundaries, pytest, ledger, teeth, build:desk, typecheck)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup-horizon
        with:
          bun-version: ${{ env.BUN_VERSION }}
          domainforge-version: ${{ env.DOMAINFORGE_VERSION }}
          realitytrace-version: ${{ env.REALITYTRACE_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Toolchain check
        run: just check-toolchain

      - name: just verify-static
        run: just verify-static

      - name: Build desk
        run: bun run build:desk

      - name: Typecheck
        run: bun x tsc --noEmit -p .

  test:
    name: test (shard ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup-horizon
        with:
          bun-version: ${{ env.BUN_VERSION }}
          domainforge-version: ${{ env.DOMAINFORGE_VERSION }}
          realitytrace-version: ${{ env.REALITYTRACE_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          chromium: "true"

      - name: bun test (shard ${{ matrix.shard }} of ${{ env.TEST_SHARDS }})
        run: >-
          bun run scripts/ci-test-shard.ts ${{ matrix.shard }} ${{ env.TEST_SHARDS }} --
          --reporter=junit --reporter-outfile=${{ runner.temp }}/junit-${{ matrix.shard }}.xml

      - name: Per-file timings
        if: always()
        run: |
          f="$RUNNER_TEMP/junit-${{ matrix.shard }}.xml"
          test -f "$f" || exit 0
          {
            echo "### bun test shard ${{ matrix.shard }}: slowest files"
            echo '| file | seconds |'
            echo '|---|---|'
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          rows = []
          for suite in ET.parse(sys.argv[1]).getroot().iter("testsuite"):
              rows.append((float(suite.get("time") or 0), suite.get("name") or "?"))
          for t, n in sorted(rows, reverse=True)[:10]:
              print(f"| {n} | {t:.1f} |")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bun-test-timings-${{ matrix.shard }}
          path: ${{ runner.temp }}/junit-${{ matrix.shard }}.xml
          if-no-files-found: ignore
          retention-days: 7

  verify:
    name: verify (just verify, build:desk, typecheck)
    needs: [changes, static, test]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Aggregate
        env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          CHANGES: ${{ needs.changes.result }}
          STATIC: ${{ needs.static.result }}
          TEST: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          echo "changes=$CHANGES static=$STATIC test=$TEST docs_only=$DOCS_ONLY"
          test "$CHANGES" = success
          if [ "$DOCS_ONLY" = "true" ]; then
            echo "### Documentation-only change: gates not run (only .agents/reports notes changed)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$STATIC" = success
          test "$TEST" = success
          {
            echo "### Gates not run in CI (NOT_RUN)"
            echo "- Live tests that need SEA_FORGE_SERVER_BIN (test/J02-live, J02r2-live) skip themselves: no SEA-Forge server binary is provisioned here."
            echo "- Live tests that need HORIZON_BWRAP (test/realitytrace-obligation) skip themselves: no bubblewrap sandbox is configured here."
            echo "- Per-task gates (gate-tNN) and gateway/seed recipes are not part of \`just verify\` and are not run."
          } >> "$GITHUB_STEP_SUMMARY"
