name: Desktop

# CI builds of the Tauri desktop app and the headless server, per platform. These are NOT releases:
# nothing is published, tagged or signed. Artifacts stay named `unqualified` until a release workflow consumes
# QUALIFIED records; this workflow only produces the records.
#
# WP-67: the `qualify` job installs each platform's bundles on a clean runner (checksums, install, smoke of the INSTALLED
# server and resources, uninstall) with scripts/qualify-desktop.py and uploads `horizon-qualification-<platform>` records.
# A platform is QUALIFIED only when every required step PASSed (scripts/qualification-platforms.json). Upgrade is NOT_RUN:
# there is no previous release. See docs/how-to/qualify-desktop-install.md.
#
# `runnable`: the server loads DomainForge through the npm package @godspeedai/domainforge (0.22.2, forced in package.json
# `overrides`), whose native bindings ship as per-platform packages for every leg below. A leg whose smoke may not pass
# would be marked `runnable: "false"`: its smoke is then run and recorded as BLOCKED instead of being required. macOS bundles
# are ad-hoc signed only because Apple Silicon refuses to run unsigned code.

on:
  pull_request:
    paths:
      - "src-tauri/**"
      - "src/main.ts"
      - "src/desktop.ts"
      - "src/runtime/resource-root.ts"
      - "src/ui/desk/**"
      - "scripts/build-sidecar.ts"
      - "scripts/smoke-sidecar.ts"
      - "scripts/build-desk.ts"
      - "config/**"
      - "contracts/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/desktop.yml"
  # A main push seeds the Rust cache (rust-cache saves only on main); pull requests and release tags only restore it.
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "src/main.ts"
      - "src/desktop.ts"
      - "src/runtime/resource-root.ts"
      - "src/ui/desk/**"
      - "scripts/build-sidecar.ts"
      - "scripts/smoke-sidecar.ts"
      - "scripts/build-desk.ts"
      - "config/**"
      - "contracts/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
  # release-desktop.yml calls this workflow at the release tag's commit (WP-68). `ref` is that commit; it is empty for the
  # triggers above, which build the triggering commit.
  workflow_call:
    inputs:
      ref:
        description: "Commit SHA to build and qualify (default: the triggering commit)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: "1.4.0"
  TAURI_CLI_VERSION: "2.12.4"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            triple: x86_64-pc-windows-msvc
            runnable: "true"
            bundles: nsis,msi
          - name: linux-x64
            runner: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            runnable: "true"
            bundles: deb,appimage
          - name: linux-arm64
            runner: ubuntu-22.04-arm
            triple: aarch64-unknown-linux-gnu
            runnable: "true"
            bundles: deb,appimage
          - name: macos-arm64
            runner: macos-15
            triple: aarch64-apple-darwin
            runnable: "true"
            bundles: app,dmg
          - name: macos-x64
            runner: macos-15-intel
            triple: x86_64-apple-darwin
            runnable: "true"
            bundles: app,dmg
    defaults:
      run:
        shell: bash
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      # linuxdeploy's strip would damage the compiled server, whose JavaScript payload is appended to the executable.
      NO_STRIP: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install repository dependencies
        run: bun install --frozen-lockfile

      - name: Linux system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential file patchelf libssl-dev libgtk-3-dev librsvg2-dev libxdo-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the sidecar (compiled server and its resources)
        run: bun run build:sidecar --target ${{ matrix.triple }}

      - name: Smoke the sidecar, resources passed explicitly
        id: smoke1
        continue-on-error: ${{ matrix.runnable != 'true' }}
        run: bun run scripts/smoke-sidecar.ts .tmp/sidecar/${{ matrix.triple }}/horizon-server .tmp/sidecar/${{ matrix.triple }}/horizon-resources

      - name: Headless tarball
        run: |
          set -euo pipefail
          name="horizon-headless-unqualified-${{ matrix.triple }}"
          mkdir -p "out" "stage/$name"
          cp -R .tmp/sidecar/${{ matrix.triple }}/. "stage/$name/"
          tar -czf "out/$name.tar.gz" -C stage "$name"

      - name: Smoke the headless tarball as a user would run it
        id: smoke2
        continue-on-error: ${{ matrix.runnable != 'true' }}
        run: |
          set -euo pipefail
          name="horizon-headless-unqualified-${{ matrix.triple }}"
          mkdir -p unpack
          tar -xzf "out/$name.tar.gz" -C unpack
          bin=$(ls unpack/"$name"/horizon-server*)
          bun run scripts/smoke-sidecar.ts "$bin"

      - name: Supervisor tests (Rust)
        run: cargo test --manifest-path src-tauri/Cargo.toml -p horizon-supervisor

      - name: Diagnose the server's dynamic dependencies (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          f=.tmp/sidecar/${{ matrix.triple }}/horizon-server
          ldd --version | head -1
          file "$f" | cut -c1-200
          ldd "$f"; echo "ldd exit=$?"
          readelf -lW "$f" | head -30

      - name: Build the Tauri bundles
        run: |
          # hdiutil on hosted macOS runners intermittently reports "Resource busy" while creating the dmg; retry that, nothing else.
          attempts=1; [ "$RUNNER_OS" = "macOS" ] && attempts=3
          for i in $(seq 1 "$attempts"); do
            bun x @tauri-apps/cli@${{ env.TAURI_CLI_VERSION }} build --bundles ${{ matrix.bundles }} --ci --verbose && exit 0
            echo "bundle attempt $i failed"; sleep 10
          done
          exit 1

      - name: Collect bundles and checksums
        run: |
          set -euo pipefail
          mkdir -p out
          bundle=src-tauri/target/release/bundle
          find "$bundle" -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) | while read -r f; do
            cp "$f" "out/horizon-desktop-unqualified_$(basename "$f")"
          done
          # An .app is a directory: archive it so it survives upload with its permissions.
          if [ -d "$bundle/macos" ]; then
            for app in "$bundle"/macos/*.app; do
              # The target triple keeps the arm64 and x64 archives apart in a release (horizon-v0.1.1 collided).
              [ -d "$app" ] && tar -czf "out/horizon-desktop-unqualified_$(basename "$app" .app)_${{ matrix.triple }}.app.tar.gz" -C "$bundle/macos" "$(basename "$app")"
            done
          fi
          cd out
          if command -v sha256sum >/dev/null; then sha256sum * > SHA256SUMS; else shasum -a 256 * > SHA256SUMS; fi
          ls -l
          cat SHA256SUMS

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.name }} (${{ matrix.triple }}) - UNQUALIFIED CI build"
            echo "Bundles requested: ${{ matrix.bundles }}. Not signed, not published, not install-qualified (WP-67)."
            echo "Sidecar smoke: explicit resources = ${{ steps.smoke1.outcome }}, headless tarball = ${{ steps.smoke2.outcome }}."
            if [ "${{ matrix.runnable }}" != "true" ]; then echo "BLOCKED on this target: @godspeedai/domainforge ships no native binding here, so the server cannot start. Bundles were built but have never run the server."; fi
            echo '```'
            cat out/SHA256SUMS 2>/dev/null || echo "no artifacts produced"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: horizon-unqualified-${{ matrix.name }}
          path: out/
          if-no-files-found: error
          retention-days: 14

  qualify:
    name: qualify ${{ matrix.name }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, runner: windows-latest }
          - { name: linux-x64, runner: ubuntu-22.04 }
          - { name: linux-arm64, runner: ubuntu-22.04-arm }
          - { name: macos-arm64, runner: macos-15 }
          - { name: macos-x64, runner: macos-15-intel }
    defaults:
      run:
        shell: bash
    steps:
      # The checked-out commit's own scripts qualify the artifact that same commit built (`ref` only names that commit for a caller).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Download the built bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: horizon-unqualified-${{ matrix.name }}
          path: dist

      - name: Linux packages for the installed GUI run
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb iproute2

      - name: Qualify the installed bundles
        run: |
          py=python3; [ "$RUNNER_OS" = "Windows" ] && py=python
          "$py" -I scripts/qualify-desktop.py --platform "${{ matrix.name }}" --dist dist --commit "$(git rev-parse HEAD)" \
            --out "qualification/${{ matrix.name }}.json" --runner-image "${{ matrix.runner }}"

      - name: Summary
        if: always()
        run: |
          py=python3; [ "$RUNNER_OS" = "Windows" ] && py=python
          f="qualification/${{ matrix.name }}.json"
          [ -f "$f" ] || { echo "### ${{ matrix.name }}: NO RECORD (qualification did not finish)" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          "$py" -I - "$f" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          print(f"### {r['platform']}: {r['status']}")
          print(f"commit `{r['commit']}`, runner `{r['host']['runner_image']}`, {r['host']['system']} {r['host']['machine']}")
          print("\n| step | status | reason |\n|---|---|---|")
          for s in r["steps"]:
              print(f"| {s['name']} | {s['status']} | {s['reason'][:140]} |")
          PY

      - name: Upload the qualification record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: horizon-qualification-${{ matrix.name }}
          path: qualification/
          if-no-files-found: warn
          retention-days: 30
