      note: >-
        The phone's rejection row, refused for the same reason the approval row is.
    - id: device.case.open
      caller_path: device_credential
      enforced_today: true
      enforced_by: >-
        The device's passkey assertion and the session it opens. The purpose the person typed
        on the phone is checked for emptiness and length, and the case it opens is the caller's own
        work; nothing outside it is decided and no authority is claimed. The caller recorded on the
        case is the device, and the durable operator the enrolment belongs to is recorded beside it
        as attribution rather than substituted for it (R5-03).
      missing: []
    - id: device.surface.intent.commit
      caller_path: device_credential
      enforced_today: false
      refused_today: true
      refusal_reason: >-
        P1 and the commit path is the person's: a device credential proves which enrolled device
        is at the route and never which person is holding it, and there is no device-attributed
        delegation from an operator at this freeze, so the row is refused before any target effect
        and the refusal is audited.
      target_effect: none
      refusal_audit: appends_refusal_audit
      enforced_by: >-
        Nothing runs. The phone's command route resolves the kind to this row, reads the refusal
        the catalog states, and refuses before the commit is called. The commit path itself refuses
        a device actor as a backstop, so a catalog that drifted back to the row still cannot run it.
      missing:
        - device_delegation_from_operator
        - pending_record
      required_stage: Stage 0B
      production_stage: Stage 3
    - id: horizon.settlement.rule
      caller_path: human_session
      enforced_today: false
      refused_today: true
      refusal_reason: >-
        P3 and the ruling commits to SEA-Forge: the authority decision, the
        operation-bound pending record and the person's A3-UV confirmation do not exist
        at this freeze, so the row is refused before any target effect and the refusal
        is audited.
      target_effect: none
      refusal_audit: appends_refusal_audit
      enforced_by: >-
        The paired desk session cookie, and the dispatch rule: the acceptance card names the move
        and the ruling phase is fixed by the card.
      missing: [durable_principal_binding, evidence_A3_UV, pending_record, authority_sea_forge_confirmation]
      required_stage: "Stage 0B"
      production_stage: "Stage 3"
    - id: approval.approve
      caller_path: human_session
      enforced_today: false
      refused_today: true
      refusal_reason: >-
        P3 and the row needs the operation-bound pending record, the person's A3-UV
        confirmation, the SEA-Forge authority decision and the separation-of-duty check.
        None of them exists at this freeze, so the desk refuses the decision before any
        target effect and audits the refusal.
      target_effect: none
      refusal_audit: appends_refusal_audit
      enforced_by: >-
        The paired desk session cookie, and the dispatch rule: the card kind is resolved by the
        server and the choice is fixed by the operation.
      missing: [durable_principal_binding, evidence_A3_UV, pending_record, separation_of_duty_check]
      required_stage: "Stage 0B"
      production_stage: "Stage 3"
    - id: approval.reject
      caller_path: human_session
      enforced_today: false
      refused_today: true
      refusal_reason: >-
        P3 and the row needs the operation-bound pending record, the person's A3-UV
        confirmation, the SEA-Forge authority decision and the separation-of-duty check.
        None of them exists at this freeze, so the desk refuses the decision before any
        target effect and audits the refusal.
      target_effect: none
      refusal_audit: appends_refusal_audit
      enforced_by: >-
        The paired desk session cookie, and the dispatch rule: the card kind is resolved by the
        server and the choice is fixed by the operation.
      missing: [durable_principal_binding, evidence_A3_UV, pending_record, separation_of_duty_check]
      required_stage: "Stage 0B"
      production_stage: "Stage 3"
    - id: device.pair.request
      caller_path: code_holder
      enforced_today: false
      refused_today: false
      enforced_by: >-
        Implemented, not claimed as enforced: the invitation's ticket and a verified passkey registration
        are checked, and the request is held as a pending enrolment that no controller has authorized. It
        creates no credential and no session.
      missing: [durable_principal_binding]
      required_stage: "Stage 0B"
      production_stage: "Stage 3"
      note: >-
        The route proves the invitation and the registration, never which person holds the phone. The
        request is refused when no active controller exists to authorize it.
    - id: device.pair.authorize
      caller_path: device_credential
      enforced_today: false
      refused_today: false
      enforced_by: >-
        Implemented, not claimed as enforced: the controller's passkey assertion is verified
        with user verification against the identity service's stored key and sign count, over
        the enrolment's operation digest, and the confirmation is one compare-and-swap. Nothing
        enrols until device.pair commits.
      missing: [authority_sea_forge, enrollment_presence_receipt]
      required_stage: "Stage 0B"
      production_stage: "Stage 3"
      note: >-
        The authorization is A3-UV evidence from the controller's own passkey, recorded as the approval
        for the exact operation digest. It is not a SEA-Forge authority decision and not the state writer:
        the state writer is the identity service, and store compare-and-swap enforces the transition. The
        SEA-Forge authority is not yet published, so this row is not enforced as a governed decision.
    - id: device.pair
      caller_path: authorized_pending_record
      enforced_today: false
      refused_today: false
      enforced_by: >-
        Implemented, not claimed as enforced: the commit creates an active credential only for a
        confirmed enrolment with a recorded approval by a current controller, inside its window, for
        the same generation and controllers, re-derives the digest the controller proved, and applies
        the confirmation once. Stage 0B does not obtain a SEA-Forge P3 authority decision, and the
        identity service's vendored API accepts no evidence, so Horizon verifies the evidence first.
      missing: [authority_sea_forge, identity_service_evidence_check]
      required_stage: "Stage 0B"
      production_stage: "Stage 3"
      note: >-
        The commit is the designated writer's act. The stop and refresh paths end waiting and
        confirmed enrolments in the store, so a restart does not revive them.
    - id: remote.start
      caller_path: human_session
      enforced_today: false
      refused_today: false
      enforced_by: "The paired desk session cookie only. The remote starts immediately."
      missing: [durable_principal_binding, evidence_A3_UV, authority_cognate_local_continuation, pending_record]
      required_stage: "Stage 0B"
      production_stage: "Stage 3"
    - id: remote.refresh
      caller_path: human_session
      enforced_today: false
      refused_today: false
      enforced_by: "The paired desk session cookie only. The remote refreshes immediately."
      missing: [durable_principal_binding, evidence_A3_UV, authority_cognate_local_continuation, pending_record]
      required_stage: "Stage 0B"
      production_stage: "Stage 3"
    - id: remote.stop
      caller_path: human_session
      enforced_today: false
      refused_today: false
      enforced_by: "The paired desk session cookie only. The remote stops immediately."
      missing: [durable_principal_binding, evidence_A3_UV, authority_cognate_local_continuation, pending_record]
      required_stage: "Stage 0B"
      production_stage: "Stage 3"
    - id: workspace.export
      caller_path: human_session
      enforced_today: false
      refused_today: true
      refusal_reason: >-
        P3 and the export needs the SEA-Forge authority decision, the operation-bound
        pending record, the person's A3-UV confirmation and a separation of duty. None
        of them exists at this freeze, so the row is refused before any target effect
        and the refusal is audited.
      target_effect: none
      refusal_audit: appends_refusal_audit
      enforced_by: >-
        The paired desk session cookie only. The export is produced immediately, and no approver
        distinct from the requester is ever named.
      missing: [durable_principal_binding, evidence_A3_UV, authority_sea_forge, separation_of_duty, pending_record]
      required_stage: "Stage 3"
      note: >-
        A P3 row stays refused in Stage 0B: a local pending record or an interim A3-T receipt
        cannot stand in for the SEA-Forge decision or the separation of duty.
    - id: run.start
      caller_path: human_session
      enforced_today: false
      refused_today: true
      refusal_reason: >-
        the dispatcher's targets are not resolved: the pinned plan's operations are not
        classified in this catalog, so the route cannot know the class or the authority
        of what it starts. The route is refused before any target effect and the refusal
        is audited.
      target_effect: none
      refusal_audit: appends_refusal_audit
      enforced_by: >-
        The paired desk session cookie only. The route starts the waiting steps of a case without
        resolving the targets of the pinned plan.
      missing: [target_resolution, resolved_row_evidence, resolved_row_authority]
      required_stage: "Stage 1"
      note: >-
        The dispatcher is a family: a plan whose targets are all local P0/P1 resolves in Cognate
        with no grant and no SEA-Forge call, and any governed target binds the whole run at the
        highest class present. Until that resolution exists, the route is refused.

# Bindings that were read and do not yet meet the design's contract. A defect is recorded here,
# not waived: the row above is the reviewable statement of what the route must become.
binding_defects:
  - id: DEF-ROLE-FROM-REQUEST
    route: "POST /surface/intent"
    operation: horizon.surface.intent.commit
    observed: "commitSurfaceIntent reads `role` from the request body and falls back to human."
    required: "The caller kind and role come from the authenticated session; a request-supplied role is refused, not honoured."
    consequence: "A caller able to reach the route can ask to be reduced to the agent projection, or claim the human one."
    status: fixed
    stage: "Stage 3 (operation descriptor) — the descriptor carries caller_kind from the session."
    resolution: >-
      Closed at Stage 0A. `SurfaceIntentRequestBody` no longer has a role field, `commitSurfaceIntent`
      takes the role as an argument its caller supplies from the authenticated context, and the route
      refuses a body that names an actor (`ACTOR_NAMING_FIELDS`, 400 forbidden_field) instead of
      honouring or ignoring it. The route is a human-session route, so the role is the session's
      "human"; the agent door is the only agent-authenticated route and it never reads a role.
    evidence: "test/identity-defects.test.ts (a body role is refused and nothing is written; the recorded intent names the session's actor) and test/identity-contract.test.ts (the source no longer reads a role from a submission)."
    residual: >-
      The operation descriptor still does not carry caller_kind; Stage 3 adds it. The residual is an
      extension of the descriptor, not an open path for a request-supplied role.
  - id: DEF-ASK-ROUTE-EXECUTOR
    route: "POST /agent/panels"
    operation: ask.route
    observed: "The handler is on the agent door and is performed by an agent key."
    required: "The design's P2 row names a human_session executor for ask.route."
    consequence: "The class is not in doubt (both are governed), but the executor evidence is."
    status: fixed
    stage: "Stage 0B — the owner decides whether the agent's route claim is P2-with-agent-executor or a separate operation."
    resolution: >-
      Closed at Stage 0A by the owner's rule that the row may be corrected when the executor evidence
      is missing. The row now names `executor: registered_agent` and
      `caller_authentication: registered_agent_key`, the key the agent door authenticates, matching the
      sibling agent-door rows. `agent_execution` is the caller kind of an issuer-issued execution, not this row's executor. The class (P2), the
      authority writer (`case_record.authority`), the human evidence (A3-UV, A3-T under Stage 0B)
      and the pending expiry (10m) are unchanged, so the agent proposes and the human authorises.
      The runtime record changed too: the answer record carries `executed_by_key` and the
      conversation row carries `refs.executor_key`, both taken from the authenticated key, and the
      agent door refuses a body that names an actor.
    evidence: "test/identity-defects.test.ts (the recorded executor is the authenticated key; a body that names an executor is refused; another key cannot route this question) and test/identity-contract.test.ts (the row's executor and caller authentication)."
    residual: >-
      The design draft's Appendix A P2/P3 table named a human session for `ask.route`; the table names `registered_agent`, the key the agent door authenticates, and section 11 names the same executor in the catalog's own row
      list and in the freeze's live-enforcement table. The row's only caller is an agent
      execution, so Stage 0B does not enable it: an interim A3-T receipt and a pending record
      cannot supply the live bounded grant or the person's A3-UV evidence. The execution proof
      arrives with the issuer at Stage 1, the grant with the SEA-Forge bridge at Stage 2, and the
      person's evidence at Stage 3.

# Write routes and code operations the catalog does not yet contain. Empty: the reconciliation
# closed every gap that reading the router found. A new entry here is a defect, not a waiver.
catalog_gaps: []

# The route census. Every route either server answers is named exactly once above: by an
# operation row's `routes`, by a dispatch entry, by a route alias, by an acknowledged catalog
# gap, or by the non-operation list below. A route that is in none of them is a census gap,
# and `scripts/check-route-census.ts` refuses the build rather than letting an unaccounted
# route answer (R4-09).
#
# A non-operation route answers without performing a catalogued operation: it renders a page,
# an asset, or a redirect, or it publishes a closed vocabulary. A route that reads the world,
# the store or the transport is an operation route even when it only projects, because the
# read is the operation. A route answers the method the catalog binds and no other: a method a
# row does not claim never reaches the handler behind it.
non_operation_routes:
  - { route: "GET /m", reason: "The phone's sign-in page. It reads no state and writes none." }
  - { route: "GET /m/", reason: "The phone's sign-in page under its trailing-slash alias. It is the same page, and it reads no state and writes none." }
  - { route: "GET /", reason: "The root path. It redirects to the workspace and performs no operation." }
  - { route: "GET /desk", reason: "The desk's HTML shell. Every view is drawn from the desk's JSON reads." }
  - { route: "GET /workspace", reason: "The workspace's HTML shell. It is the desk's shell, and every view is drawn from the desk's JSON reads." }
  - { route: "GET /workspace/approvals", reason: "The approvals page's HTML shell. It is the same shell, and the approvals themselves are read from the desk's JSON reads." }
  - { route: "GET /desk/setup-guide", reason: "The static runbook behind the desk's Settings. It names programs, files and settings, and reads no state." }
  - { route: "GET /surface/schema", reason: "Read of the closed surface vocabulary. It publishes the schema itself and reads no state." }
  - { route: "GET /m/pair", reason: "The phone's pairing page. It reads no state and writes none." }
  - { route: "GET /desk/app.js", reason: "Static asset." }
  - { route: "GET /desk/app.css", reason: "Static asset." }
  - { route: "GET /agent/panels/catalogue", reason: "Read of the closed surface vocabulary." }
  - { route: "GET /desk/panels/catalogue", reason: "Read of the closed surface vocabulary." }
  - { route: "POST /desk/handoff/preview", reason: "Renders a review without sending; handoff.send is the write." }

# Refusal is a first-class outcome: every blocked action reports why and what would repair it.
refusal_codes:
  unlisted_operation: "The operation is not in the closed catalog. Nothing was written."
  unmapped_route: "The route maps to no catalog row. Nothing was written."
  unknown_action: "The route is listed but the semantic action is not. Nothing was written."
  insufficient_evidence: "The required human evidence is absent or weaker than the row demands."
  grant_required: "A governed target needs a live grant or a current entitlement."
  grant_not_allowed: "A human caller has no grant; supplying one is refused rather than ignored."
  stale_revision: "The resource moved since the operation was described."
  authority_unavailable: "The authority writer could not decide. No effect was dispatched."
  isolation_unavailable: "This host does not meet the isolation prerequisites."
  separation_of_duty: "The approver must differ from the requester and the executor."
  budget_required: "A P3 grant without an explicit numeric budget is refused."
  not_owner: "The caller's key does not own the panel or question the action names."
  caller_substituted: "The caller kind, role, or reference disagrees with the authenticated session."
  alias_action_mismatch: "The request's action or resolution disagrees with the operation ID that fixes it."
