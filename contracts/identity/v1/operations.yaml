live_enforcement:
  version: 1
  # The two authority paths, and the local-console ceremony. They are distinct, and no caller can
  # use the other one: a human session holds an entitlement and has no delegation head, while an
  # agent holds a live bounded grant and never holds an entitlement.
  paths:
    human_session:
      authority: >-
        A current SEA-Forge entitlement for the named operation, held by the durable human
        principal the issuer bound to this session.
      evidence: A3-UV
      note: >-
        A human session cannot hold a delegation grant, so it cannot be authorised by an agent's
        scope. The entitlement path is the only authority it has.
    registered_agent:
      authority: >-
        A live bounded delegation grant from SEA-Forge: the execution proof, the remaining depth,
        the remaining ancestor budget and the expiry.
      evidence: NONE
      note: >-
        The registered agent key is a caller identity, never an authority. The grant is the
        authority, and it is checked against the execution that presents it. The path is named for
        the principal the route proves, not for a logical execution: the agent door authenticates
        a stable registered key and holds no issuer-bound execution or attempt proof, so a row
        whose authority depends on the execution says so in what is missing (R5-04).
    local_console:
      authority: >-
        The one-time code shown at the local console. Possession of it is evidence for this local
        session only; it is not an assurance predicate and it grants no authority over anything
        else.
      evidence: NONE
      note: "The desk's browser-session ceremony. It creates one local session and enrolls no credential."
    code_holder:
      authority: >-
        None beyond possession of the one-time code. The route cannot establish who presented the
        code, so it establishes neither local-console presence nor any authority over anything
        else.
      evidence: NONE
      note: >-
        A separate path from `local_console`, because the route proves less. `local_console` is a
        console that proves its own presence; `code_holder` is whoever holds the code. The two are
        never interchangeable.
    none:
      authority: "No authority: the row has no effect to authorize."
      evidence: NONE
      note: "The public liveness probe."
    none_unauthenticated:
      authority: "No authority: the caller proved nothing when it asked."
      evidence: NONE
      note: >-
        A caller that has not authenticated. It may ask for a challenge and learn whether a device
        is enrolled, and nothing else. It is a different path from `none`: the liveness probe
        writes nothing and says nothing about the deployment, while this path writes a challenge.
    device_credential:
      authority: >-
        The enrolled device's credential, verified against the challenge it was issued for. The
        session it opens is the device's own and ends when the device signs out or the credential
        is revoked.
      evidence: NONE
      note: >-
        A phone that signed in with its passkey. It is not a human session: the device credential
        proves which enrolled device is at the route, never which person is holding it.
    authorized_pending_record:
      authority: >-
        A pending enrolment that the active controller's user-verified passkey confirmed, moved by one
        compare-and-swap, inside its window and for the same generation and controllers. The writer
        applies it once.
      evidence: A3-UV
      note: >-
        The route presents only a pending id. What it proves is the record's own state: the confirmation
        is the controller's A3-UV proof, verified by the authorize route, and nothing the caller presents
        at this route can create a confirmation.
  # One entry per live-bound row. `enforced_today` is a statement about this repository's running
  # code at the freeze, checked against the source. A row whose enforcement is missing says what
  # is missing and which stage must close it; it is never left implied by the class.
  rows:
    - id: horizon.health
      caller_path: none
      enforced_today: true
      enforced_by: >-
        The route answers before any authentication and answers every caller the same way: the
        process is up, and nothing else. It reports no deployment profile, operator reference,
        semantic world, research state or transport, to a paired caller or an unpaired one.
      missing: []
    - id: horizon.diagnostics.read
      caller_path: human_session
