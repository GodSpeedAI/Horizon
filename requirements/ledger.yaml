- id: REQ-NAV-009
  title: REQ-NAV-009
  statement: 'The payment gate''s inputs are the binding''s declared bounds and the observer''s available capacity per (currency, unit): allowance (non-negative or unbounded, optionally per UTC day) minus reserved and consumed bounds. An entry with a positive or unknown bound and no allowance is unknown; an unknown bound against a numeric capacity is unknown; a bound above available capacity is blocked. Committing MUST reserve every declared bound atomically with recording the intent, so concurrent intents cannot jointly exceed capacity; a reservation becomes consumption when the intent is terminal. The gate is never weighed against expected value.'
