  gate_command: just gate-t01
  status: candidate
- id: AC-STACK-002-01
  requirement: REQ-STACK-002
  expected: Cognate MUST own app events/capability invocation/projection state; adapters MUST not create a second authoritative event history.
  gate_command: just gate-t04
  status: candidate
- id: AC-STACK-003-01
  requirement: REQ-STACK-003
  expected: SEA-Forge MUST authorize each consequential invocation; preflight MUST NOT substitute for invocation authorization.
  gate_command: just gate-t11
  status: candidate
