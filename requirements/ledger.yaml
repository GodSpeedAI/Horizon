- id: AC-CASE-001-01
  requirement: REQ-CASE-001
  expected: A Case is observed to remain a purpose-relative derived view anchored in authoritative facts and declared direction, not a competing ontology.
  gate_command: *id003
  status: candidate
- id: AC-CASE-002-01
  requirement: REQ-CASE-002
  expected: The next primary move responds to material deviation. No primary recommendation is required when only optional choices remain.
  gate_command: *id004
  status: candidate
- id: AC-CASE-003-01
  requirement: REQ-CASE-003
  expected: Settlement reachable and should settle now is observed to be separate; the latter requires an authorized judgment.
  gate_command: *id005
  status: candidate
- id: AC-CMP-001-01
  requirement: REQ-CMP-001
  expected: Hypothetical comparison is never observed to change world state or grant authority. A simulated alternative is never observed to commit an intent or stand in for an authorization.
  gate_command: *id006
  status: candidate
- id: AC-CONFIG-001-01
  requirement: REQ-CONFIG-001
  expected: An observer identity supplied in presentation metadata (frame, intent or surface payload) is ignored; the effective observer_ref is the OS-session-derived operator for local_operator, and the attempt is observable in the audit record.
  gate_command: *id007
  status: candidate
- id: AC-CONFIG-002-01
  requirement: REQ-CONFIG-002
  expected: Semantic world selection is observed to pin a valid DomainForge world_ref, and operations MUST carry a checkpoint reference.
  gate_command: *id008
  status: candidate
- id: AC-CONFIG-003-01
  requirement: REQ-CONFIG-003
  expected: With the semantic adapter's world unpinned or unavailable, the affected operation reports blocked/unknown with the missing gate named, and no other operation's read-only affordances disappear.
  gate_command: *id009
  status: candidate
- id: AC-CONFIG-004-01
  requirement: REQ-CONFIG-004
  expected: Configured provider endpoints, credentials, timeouts and scope remain below stable behavior contracts.
  gate_command: *id010
  status: candidate
- id: AC-CONFIG-010-01
  requirement: REQ-CONFIG-010
  expected: A read-only startup reports the pinned world_ref, the resolved observer and the projection capabilities it supports, and refuses to start (rather than guess) when the world cannot be pinned.
  gate_command: *id011
  status: candidate
- id: AC-CONFIG-011-01
  requirement: REQ-CONFIG-011
  expected: At invocation the runtime re-checks target, actor, world revision, authority and settlement prerequisites; a change after preflight yields a refusal naming the changed prerequisite, not an executed action.
  gate_command: *id012
  status: candidate
- id: AC-CONFIG-012-01
  requirement: REQ-CONFIG-012
  expected: A failed preflight blocks only the operations that depend on the missing prerequisite; unrelated read-only exploration remains reachable and is visibly marked as unaffected.
  gate_command: *id013
  status: candidate
- id: AC-DEV-001-01
  requirement: REQ-DEV-001
  expected: Failure, contradictions, recovery, payment and orchestration burden each remain available to developmental evaluation; none of the five is observed to be missing from what developmental evaluation can read.
  gate_command: *id014
  status: candidate
- id: AC-DEV-002-01
  requirement: REQ-DEV-002
  expected: A durable capability claim is refused unless repeated settlement under variation plus transfer or recovery evidence is recorded; a single success cannot mint it.
  gate_command: *id015
  status: candidate
- id: AC-DEV-003-01
  requirement: REQ-DEV-003
  expected: Developmental settlement scoring and capability-promotion rules are observed to have exactly one authoritative implementation. If ported from GodSpeed Agent, its golden fixtures and tests are the conformance oracle and the superseded implementation is retired for that function; inherited thresholds migrate as provenance-bearing configuration, never silently changed.
  gate_command: *id016
  status: candidate
- id: AC-GOAL-001-01
  requirement: REQ-GOAL-001
  expected: Horizon is observed to provide a navigable shared semantic and operational world independent of chat.
  gate_command: *id017
  status: candidate
- id: AC-GOAL-002-01
  requirement: REQ-GOAL-002
  expected: Horizon is observed to derive contextual interactions from source-grounded objects, relationships, cases, and capabilities.
  gate_command: *id018
  status: candidate
- id: AC-GOAL-003-01
  requirement: REQ-GOAL-003
  expected: Horizon is observed to preserve behavioral equivalence between sequential Clack and richer atomic GUI projections.
  gate_command: *id019
  status: candidate
- id: AC-GOAL-004-01
  requirement: REQ-GOAL-004
  expected: Horizon is observed to maintain separate governance, execution, evidence, operational settlement, and developmental claims.
  gate_command: *id020
  status: candidate
- id: AC-GOAL-005-01
  requirement: REQ-GOAL-005
  expected: Horizon is observed to preserve navigation context across focus changes, renderer changes, interruption, and replay.
  gate_command: *id021
  status: candidate
- id: AC-INT-001-01
  requirement: REQ-INT-001
  expected: Every canonical journey is observed to project the IS1–IS8 Behavioral IR responsibilities and identify unresolved bindings explicitly.
  gate_command: *id022
  status: candidate
- id: AC-INT-002-01
  requirement: REQ-INT-002
  expected: The GUI is observed to preserve persistent case/world/focus context while Clack presents one next meaningful decision at a time.
  gate_command: *id023
  status: candidate
- id: AC-INT-003-01
  requirement: REQ-INT-003
  expected: A replayed navigation intent id resolves to the original commit and returns its stored outcome, and no second external side effect is attempted or recorded.
  gate_command: *id024
