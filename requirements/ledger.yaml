  requirement: REQ-STACK-011
  expected: 'A product joins the world only through the product integration contract: a DomainForge module for its types, links and operations; a read connector emitting provenance-bearing observations into Cognate; capability bindings for actions, each covered by SEA-Forge policy; and optional RealityTrace evidence hooks. Its integration level (visible, queryable, actionable, evidenced) MUST be derived from which facets are proven.'
  gate_command: just gate-t20
  status: candidate
- id: AC-STACK-012-01
  requirement: REQ-STACK-012
  expected: Products MUST NOT be required to adopt Horizon's language, storage or UI; non-TypeScript products integrate through process, CLI, MCP or Connect boundaries owned by Cognate.
  gate_command: just gate-t20
  status: candidate
