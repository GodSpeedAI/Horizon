  requirement: REQ-CONFIG-012
  expected: Preflight failure MUST block only dependent operations and retain unrelated read-only affordances.
  gate_command: just gate-t11
  status: candidate
- id: AC-DEV-001-01
  requirement: REQ-DEV-001
  expected: Failure, contradictions, recovery, payment and orchestration burden MUST remain available to developmental evaluation.
  gate_command: just gate-t17
  status: candidate
- id: AC-DEV-002-01
  requirement: REQ-DEV-002
  expected: Durable capability MUST NOT be claimed without repeated settlement under variation and transfer/recovery evidence.
