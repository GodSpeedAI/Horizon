  status: candidate
- id: AC-DEV-003-01
  requirement: REQ-DEV-003
  expected: Developmental settlement scoring and capability-promotion rules MUST have exactly one authoritative implementation. If ported from GodSpeed Agent, its golden fixtures and tests are the conformance oracle and the superseded implementation is retired for that function; inherited thresholds migrate as provenance-bearing configuration, never silently changed.
  gate_command: just gate-t17
  status: candidate
