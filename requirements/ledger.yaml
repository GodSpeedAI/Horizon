- id: REQ-NAV-012
  title: REQ-NAV-012
  statement: Settlement of an intent that requires operational settlement MUST be decided by SEA-Forge from RealityTrace evidence of verification runs started after execution whose ledger positions lie after the discrimination run and at or before the ledger head recorded in a durable closure record no later than the window deadline plus the close grace; each run's timeout ends before the deadline; only evidence whose RealityTrace-recorded completion time is at or before the deadline is admissible, and evidence without one is undefined; when no on-time closure record exists the intent is unresolved and rejected. Only known exit codes decide; timeouts, crashes, null exits and digest or argv mismatches are undefined. Known 0 with no known non-zero is supported and settled; known non-zero with no known 0 is contradicted and rejected; both is inconsistent and unsettled; no known result is unresolved and rejected for an obligation; before the window closes the intent is pending. Only the obligation
    modality with the command verifier is supported in this version. An exempt intent without an expectation is not_required, never settled. Disposition remains the observer's authorized judgment.
  source:
    file: .agents/specs/horizon.agent.spec.yaml
    section: $.core_behavior_requirements.navigation_and_affordances[12]
