  gate_command: just gate-t13
  status: candidate
- id: AC-STACK-008-01
  requirement: REQ-STACK-008
  expected: Every cross-system episode MUST preserve correlation through observer/world/case/intent/authority/execution/evidence/settlement refs.
  gate_command: just gate-t19
  status: candidate
- id: AC-STACK-009-01
  requirement: REQ-STACK-009
  expected: Only a SEA-Forge allow disposition with a matching invocation grant (bound to the exact action, targets, world_ref and unexpired) MAY permit a side effect; deny, escalate, boundary, degraded and any unrecognized disposition MUST produce no effect and a visible typed status.
