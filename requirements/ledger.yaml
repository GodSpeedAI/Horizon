  gate_command: just gate-t07
  status: candidate
- id: AC-NAV-002-01
  requirement: REQ-NAV-002
  expected: Affordance gates MUST use exactly the canonical keys visibility, reach, payment, authority, capability, recovery and settlement_access.
  gate_command: just gate-t07
  status: candidate
- id: AC-NAV-003-01
  requirement: REQ-NAV-003
  expected: Only eligible paths MAY be recommended as spendable; blocked paths MUST expose material reasons and reachable prerequisites where known.
  gate_command: just gate-t07
  status: candidate
- id: AC-NAV-004-01
  requirement: REQ-NAV-004
