  requirement: REQ-GOAL-001
  expected: Horizon MUST provide a navigable shared semantic and operational world independent of chat.
  gate_command: just gate-t01
  status: candidate
- id: AC-GOAL-002-01
  requirement: REQ-GOAL-002
  expected: Horizon MUST derive contextual interactions from source-grounded objects, relationships, cases, and capabilities.
  gate_command: just gate-t02
  status: candidate
- id: AC-GOAL-003-01
  requirement: REQ-GOAL-003
  expected: Horizon MUST preserve behavioral equivalence between sequential Clack and richer atomic GUI projections.
  gate_command: just gate-t03
  status: candidate
- id: AC-GOAL-004-01
  requirement: REQ-GOAL-004
  expected: Horizon MUST maintain separate governance, execution, evidence, operational settlement, and developmental claims.
  gate_command: just gate-t17
  status: candidate
- id: AC-GOAL-005-01
  requirement: REQ-GOAL-005
  expected: Horizon MUST preserve navigation context across focus changes, renderer changes, interruption, and replay.
  gate_command: just gate-t04
  status: candidate
