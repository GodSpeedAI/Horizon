- id: REQ-NAV-011
  title: REQ-NAV-011
  statement: An intent requires operational settlement unless its operation is read_only and its binding does not require settlement. Such an intent MUST carry an expected outcome (modality, statement, refuted_by, irrelevant distinctions, unaccounted factors, window) whose verifier is the operation binding's vetted, read-only template, every executed or loaded artifact of which is pinned by sha256 and checked before each run, instantiated only with the operation's effect identity. The expectation is registered with RealityTrace as a question and threshold before authority is requested; its digest, threshold id and threshold position are carried exactly in the SEA-Forge authority request; it is covered by the intent's idempotency key and never revised. After authority and before execution, a confined read-only discrimination run MUST NOT already observe the statement; if it does, or cannot complete, the operation MUST NOT be executed. An invocation that would start after the window closes
    MUST be refused.
  source:
    file: .agents/specs/horizon.agent.spec.yaml
    section: $.core_behavior_requirements.navigation_and_affordances[11]
