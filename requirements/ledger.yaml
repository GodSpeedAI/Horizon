  gate_command: just gate-t05
  status: candidate
- id: AC-SEC-004-01
  requirement: REQ-SEC-004
  expected: Multi-user or remote deployments MUST NOT reuse Product Actualizer loopback-token trust assumptions unchanged.
  gate_command: just gate-t05
  status: candidate
- id: AC-SEC-005-01
  requirement: REQ-SEC-005
  expected: Credential and private reference material MUST never be exposed through shared UI context, logs or evidence.
  gate_command: just gate-t11
  status: candidate
- id: AC-SEC-006-01
  requirement: REQ-SEC-006
