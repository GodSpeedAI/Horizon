  requirement: REQ-INT-001
  expected: Every canonical journey MUST project the IS1–IS8 Behavioral IR responsibilities and identify unresolved bindings explicitly.
  gate_command: just gate-t02
  status: candidate
- id: AC-INT-002-01
  requirement: REQ-INT-002
  expected: The GUI MUST preserve persistent case/world/focus context while Clack presents one next meaningful decision at a time.
  gate_command: just gate-t03
  status: candidate
- id: AC-INT-003-01
  requirement: REQ-INT-003
  expected: Actions MUST use stable semantic IDs, frame revision checks and idempotency keys.
  gate_command: just gate-t15
  status: candidate
- id: AC-INT-004-01
  requirement: REQ-INT-004
