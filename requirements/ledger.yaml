  gate_command: just gate-t07
  status: candidate
- id: AC-OUT-002-01
  requirement: REQ-OUT-002
  expected: Every choice MUST bind a typed semantic operation and its current affordance assessment; it MUST NOT gain authority from UI enablement.
  gate_command: just gate-t07
  status: candidate
- id: AC-OUT-003-01
  requirement: REQ-OUT-003
  expected: Each consequential attempt MUST preserve predeclared expectations, authorization correlation, execution references, and observation status.
  gate_command: just gate-t11
  status: candidate
- id: AC-OUT-004-01
  requirement: REQ-OUT-004
  expected: Both renderers MUST project the same behavior without duplicating source-of-truth rules or creating a second approval path.
  gate_command: just gate-t09
  status: candidate
- id: AC-RES-001-01
  requirement: REQ-RES-001
  expected: The GodSpeed Agent Python research infrastructure (dataset adapters, corpora builders, calibration pipeline, preregistered experiment matrices, shadow and guarded evaluation, predictive model port) MUST be carried into Horizon as a Python research subsystem behind typed, versioned process contracts invoked via Cognate capabilities. Horizon MUST NOT reimplement ML training or evaluation in TypeScript.
  gate_command: just gate-t21
  status: candidate
- id: AC-RES-002-01
  requirement: REQ-RES-002
  expected: Research artifacts (datasets and corpora, preregistrations, experiment runs, results and verdicts, models, shadow evaluations) MUST be navigable world objects with content-hash provenance. Migrated results MUST keep their original claim level and verdict and MUST NOT be upgraded by migration.
  gate_command: just gate-t21
  status: candidate
- id: AC-RES-003-01
  requirement: REQ-RES-003
  expected: Starting a research run MUST be a consequential governed operation with a compute/payment gate and a preregistration frozen before execution; long runs use Gauntlet or a bounded Cognate execution world, and results become evidence, not settlement by assertion.
  gate_command: just gate-t21
  status: candidate
- id: AC-RES-004-01
  requirement: REQ-RES-004
  expected: 'Predictive estimates MAY inform payment, consequence or ranking only after governed activation: a frozen preregistered held-out criterion, retained evaluation evidence and an authorized promotion. Active, heuristic and disabled estimator states MUST be visible, and estimates MUST NOT change hard-gate outcomes.'
  gate_command: just gate-t21
  status: candidate
- id: AC-RES-005-01
  requirement: REQ-RES-005
  expected: Settled, failed and contradicted Horizon episodes MUST be exportable to the research subsystem as versioned, scope-filtered datasets with provenance and without secrets or cross-scope leakage.
  gate_command: just gate-t17
  status: candidate
- id: AC-RES-006-01
  requirement: REQ-RES-006
  expected: Existing agent workflows using the cybernetic_nav MCP tools and godspeed-nav CLI MUST receive an explicit mapping to Horizon equivalents or a documented deprecation; no tool may silently disappear or change meaning.
  gate_command: just gate-t21
  status: candidate
- id: AC-RES-007-01
  requirement: REQ-RES-007
  expected: Migrated ledgers, data and reports MUST preserve append-only history, original timestamps and content hashes; large data MUST be referenced by hash and location rather than committed to the repository.
  gate_command: just gate-t21
  status: candidate
