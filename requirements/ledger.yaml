  gate_command: just gate-t02
  status: candidate
- id: AC-NAV-005-01
  requirement: REQ-NAV-005
  expected: The navigation controller MUST avoid asking for context it can resolve without user burden.
  gate_command: just gate-t07
  status: candidate
- id: AC-NAV-006-01
  requirement: REQ-NAV-006
  expected: The authority gate MUST take one of likely_allow, requires_approval, deferred_to_invocation, denied, unreachable or unknown. likely_allow requires a non-granting SEA-Forge evaluation; deferred_to_invocation means SEA-Forge is reachable and the exact operation is policy-covered but no preview exists; denied, unreachable and unknown block availability. No gate value grants authority.
  gate_command: just gate-t07
  status: candidate
- id: AC-NAV-007-01
  requirement: REQ-NAV-007
  expected: Before any consequential commitment the observer MUST see the operation's reversibility class, payment, expected evidence and what happens if authority escalates.
  gate_command: just gate-t07
  status: candidate
- id: AC-OUT-001-01
  requirement: REQ-OUT-001
