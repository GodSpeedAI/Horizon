  requirement: REQ-SAFE-001
  expected: Horizon MUST fail closed on unknown runtime authorization, unsafe world revision or unreconciled duplicate commit.
  gate_command: just gate-t11
  status: candidate
- id: AC-SAFE-002-01
  requirement: REQ-SAFE-002
  expected: Horizon MUST preserve immutable expectation, evidence and error history during recovery and reframing.
  gate_command: just gate-t13
  status: candidate
