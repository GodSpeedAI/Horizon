# Seed data for the Horizon test setup only. A case that collects work from outside
# (a GitHub issue, a hand off, an agent's proposal) as steps added after it starts.
name: seed-triage
version: 0.1.0
description: >-
  Seed: triage inbox. One human step to look through what arrived.
parameters:
  inbox_name:
    type: string
    required: false
    default: "triage inbox"
plan:
  items:
    - plan_item_id: review_inbox
      name: "Seed: look through the triage inbox"
      item_kind: human_task
      markers:
        required: true
      settlement_criteria:
        require_approval: true
