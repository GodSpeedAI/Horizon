[workspace]
members = [".", "supervisor"]
resolver = "2"

[package]
name = "horizon-desktop"
version = "0.1.0"
description = "Desktop shell for Horizon: supervises the Bun server sidecar and shows its desk."
license = "Apache-2.0"
edition = "2021"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde_json = "=1.0.154"
horizon-supervisor = { path = "supervisor" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
