[package]
name = "horizon-supervisor"
version = "0.1.0"
description = "Spawns, health-waits, watches and stops one sidecar process tree. No business logic."
license = "Apache-2.0"
edition = "2021"
rust-version = "1.90"
publish = false

[dependencies]
serde_json = "=1.0.154"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[[bin]]
name = "stub-sidecar"
path = "src/bin/stub_sidecar.rs"
